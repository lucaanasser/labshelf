feature:
  name: Sync
  module: sync
  description: >
    Bidirectional multi-device synchronisation of the local library with remote
    storage through an extensible provider layer. The initial provider is Google
    Drive; the RemoteProvider interface allows future providers such as GitHub
    and Dropbox to be added without changing the SyncEngine.

structure:
  description: >
    The sync stack is split by responsibility. The provider-agnostic engine,
    the remote provider interface, the Drive implementation and the shared pure
    helpers live in @labshelf/core so the browser extension can reuse them. Only
    the VSCode adapter and the OAuth flow live in @labshelf/vscode.
  layout:
    core sync/core/syncTypes.ts: >
      Shared types — ManifestEntry, ManifestData, DiffClass, SyncOperation,
      TreeNode, LocalFileSystem, NamespaceResult, SyncResult.
    core sync/core/syncManifest.ts: >
      Persists and queries the per-provider manifest (the base of the three-way
      merge); a missing or corrupt manifest yields empty state and triggers a
      full sync.
    core sync/core/treeScan.ts: >
      Enumerates the local and remote trees of a namespace into maps keyed by
      relative path; hashes every local file for comparison.
    core sync/core/syncDiff.ts: >
      Pure three-way diff — classifies each path by comparing the local tree,
      the remote tree and the manifest base.
    core sync/core/syncApply.ts: >
      Executes the classified operations against RemoteProvider and
      LocalFileSystem, including keep-both conflict resolution.
    core sync/core/syncEngine.ts: >
      Orchestrates one sync run, provider-agnostic and free of vscode — scans,
      diffs, applies and persists the manifest.
    core sync/provider/remoteProvider.ts: >
      The RemoteProvider interface and RemoteNamespace type abstracting remote
      listing, upload, download and delete.
    core sync/provider/remotePathResolver.ts: >
      Translates relative paths between local and remote representation
      (RemotePathResolver, splitPath).
    core sync/drive/googleDriveClient.ts: >
      Low-level Drive REST API v3 client (list, multipart upload, delete),
      exported as DriveClient.
    core sync/drive/googleDriveProvider.ts: >
      RemoteProvider implementation over the Drive client, created through
      createGoogleDriveProvider.
    core sync/util/contentHash.ts: >
      Pure sha256Hex function used to hash file contents, built on Web Crypto.
    core sync/util/conflictName.ts: >
      Generates conflict-suffixed file names (conflictPath).
    vscode sync/adapter/vscodeLocalFileSystem.ts: >
      LocalFileSystem implementation over vscode.workspace.fs.
    vscode sync/adapter/syncController.ts: >
      VSCode orchestrator — initialises auth, exposes commands, manages the
      auto-sync interval and updates the status bar.
    vscode sync/auth/googleDriveAuth.ts: >
      OAuth 2.0 PKCE flow with a local loopback server to capture the
      authorization code.

architecture:
  inputs:
    - local library (papers/ with subfolders and .research/papers/<id>/data.json)
    - OAuth credentials stored through vscode.ExtensionContext.secrets
    - local manifest at .research/sync/<providerId>.state.json
  outputs:
    - paper files in the Drive library namespace (folder visible to the user)
    - manifest and annotation data in the Drive appdata namespace (hidden via appDataFolder)
  modules:
    - "RemoteProvider (core sync/provider/remoteProvider): interface abstracting remote list, upload, download and delete operations"
    - "SyncEngine (core sync/core/syncEngine): runs the three-way diff between the previous state (manifest), the current local state and the current remote state, producing a list of operations to apply"
    - "SyncManifest (core sync/core/syncManifest): reads and writes the state file that serves as the merge base; when missing or corrupt it triggers a full sync"
    - "createGoogleDriveProvider (core sync/drive/googleDriveProvider): RemoteProvider implementation over Drive REST API v3"
    - "GoogleDriveAuth (vscode sync/auth/googleDriveAuth): OAuth 2.0 PKCE flow with a local loopback server to capture the authorization code"
    - "SyncController (vscode sync/adapter/syncController): orchestrator that initialises auth, exposes VSCode commands, manages the auto-sync interval and updates the status bar"
  dependencies:
    - vscode.ExtensionContext (secure token storage through secrets)
    - vscode.workspace.fs (through sync/adapter/vscodeLocalFileSystem)
    - Drive REST API v3
    - "@labshelf/core event bus"
  notes: >
    The file-by-file breakdown of core sync/core/ lives in sync-engine.spec.yaml.

database:
  tables_used: []
  migrations: []
  notes: >
    SQLite is a rebuildable local cache (through LibraryIndexer) and is not
    synced to Drive. Annotations and themes live in
    .research/papers/<id>/data.json (PaperDataStore) and sync as ordinary files.
    Sync state lives in .research/sync/<providerId>.state.json and is never
    uploaded.

events:
  emits: []
  listens:
    - paper:added — schedules a debounced sync (30 s)
    - paper:deleted — schedules a debounced sync (30 s)
    - paper:updated — schedules a debounced sync (30 s)
    - annotation:created — schedules a debounced sync (30 s)
    - annotation:updated — schedules a debounced sync (30 s)
    - annotation:deleted — schedules a debounced sync (30 s)
  notes: >
    The sync module emits no events of its own. Progress and result feedback is
    shown directly in the status bar item.

errors:
  expected_failures:
    - OAuth cancelled by the user before the loopback completes
    - OAuth credentials missing because googleDriveCredentials.ts was never created
    - network failure during upload, download or remote listing
    - bidirectional conflict (same file changed locally and remotely since the last sync)
    - corrupt manifest or invalid JSON
    - Drive API returns status 429 (rate limit)
  handling_strategy: >
    A bidirectional conflict is resolved keep-both: the remote file is renamed
    with a "(conflict YYYY-MM-DD)" suffix before the local file is uploaded. A
    corrupt manifest triggers a full sync without a manifest as a safe fallback.
    A 429 stops the sync and shows an error message through a VSCode
    notification. Network errors are logged with enough context to diagnose them
    and surfaced to the user.

ui:
  components:
    - "status bar item: shows connection state (connected / disconnected / syncing) and the timestamp of the last successful sync; clicking runs labshelf.sync.now when connected or labshelf.sync.connect when disconnected"
  commands:
    - "labshelf.sync.connect: starts the OAuth flow and registers credentials"
    - "labshelf.sync.now: triggers an immediate manual sync"
    - "labshelf.sync.disconnect: revokes tokens and clears stored credentials"
  settings:
    - "labshelf.sync.autoSyncIntervalMinutes: periodic polling interval in minutes"
  notes: >
    The OAuth client id and secret are not VSCode settings. They are compiled in
    from packages/vscode/src/sync/auth/googleDriveCredentials.ts, which is
    gitignored and copied from the committed .example file. See
    documents/reference/google-drive-setup.md.

tests:
  unit:
    - SyncEngine yields local-new when a file exists locally but in neither the manifest nor the remote
    - SyncEngine yields remote-new when a file exists remotely but in neither the manifest nor the local tree
    - SyncEngine yields local-modified when the local hash differs from the manifest and the remote matches it
    - SyncEngine yields remote-modified when the remote hash differs from the manifest and the local matches it
    - SyncEngine yields local-deleted when a file is in the manifest, gone locally, and the remote matches the manifest
    - SyncEngine yields remote-deleted when a file is in the manifest, gone remotely, and the local matches the manifest
    - SyncEngine yields conflict when local and remote both diverge from the manifest
    - SyncEngine yields unchanged when local and remote both match the manifest
    - SyncManifest returns an empty manifest when the file is absent
    - SyncManifest returns an empty manifest and logs a warning on corrupt JSON
    - SyncManifest persists entries and reloads them correctly after save and reload
    - DriveClient lists files through a mocked fetch
    - DriveClient performs a multipart upload through a mocked fetch
    - DriveClient deletes a file through a mocked fetch
    - PaperDataStore persists and returns annotations
    - PaperDataStore persists and returns themes
    - PaperDataStore returns an empty structure when the file is absent
    - LibraryIndexer rebuilds the index with mocked readDirectory and metadata.yaml
  integration:
    - a full sync against a mocked RemoteProvider covers all 8 three-way diff operations
    - a bidirectional conflict produces a conflict-suffixed file in the mocked provider

ai_notes:
  embeddings: false
  semantic_search: false
