feature:
  name: PDF Viewer Renderer (HTML Shell)
  module: pdf-viewer
  description: >
    Generate the minimal HTML document for the PDF reader webview.
    The renderer resolves pdfjs-dist asset URIs, resolves the reader
    bundle URIs, emits the CSP header, preloads pdfjs and the reader
    bundle, embeds the boot parameters into an inert JSON block, and
    adds the structural container elements. It does not embed any
    runtime JavaScript — the runtime is a bundled ES module
    (dist/reader/reader.js) described in
    pdf-viewer/reader-webview.spec.yaml. The old template-string
    runtime (renderer/template.js.ts + renderer/template.css.ts) has
    been removed.

structure:
  description: >
    The renderer stays in pdf-viewer/renderer/ and continues to be a
    pure HTML/string builder with no webview lifecycle
    responsibilities. The template builders that inlined the runtime
    are gone. A backward-compatibility shim at
    pdf-viewer/PdfRenderer.ts still delegates to
    renderer/PdfRenderer.ts.
  layout:
    pdf-viewer/renderer/PdfRenderer.ts: >
      Orchestrator. Exposes the PdfRenderer class (generateHtml),
      resolvePdfjsUris, getPdfjsDirectory,
      resolveReaderBundleUris, getReaderBundleDirectory, and
      serializeBoot. Resolves pdfjs-dist file paths, converts them
      to webview-safe URIs, assembles the final HTML document by
      combining preloads, boot JSON, structural containers, and
      the reader bundle <script type="module">.
    pdf-viewer/renderer/index.ts: >
      Barrel export re-exporting the RenderParams and ResolvedUris
      types plus PdfRenderer, resolvePdfjsUris, getPdfjsDirectory,
      resolveReaderBundleUris, getReaderBundleDirectory,
      serializeBoot.
    pdf-viewer/PdfRenderer.ts: >
      Backward-compatibility re-export shim delegating to
      renderer/PdfRenderer.ts.

architecture:
  inputs:
    - RenderParams { webview, extensionUri, pdfUri, paperId,
      paperTitle, themeManager, themePreference, prefs }
    - resolved pdfjs-dist installation on disk (legacy or non-legacy)
    - dist/reader/reader.js and reader.css produced by esbuild
  outputs:
    - complete HTML document string for the reader webview
    - ResolvedUris bundle (pdfjs, worker, viewer, viewer CSS
      webview URIs; cMap, standard-font, wasm and icc base URLs)
    - ReaderBundleUris { scriptUri, styleUri } when
      dist/reader/reader.js exists
    - a "bundle-missing" HTML shell when dist/reader/reader.js is
      absent (self-contained, no <script>, CSP allows only inline
      style)
  dependencies:
    - vscode Webview and Uri APIs
    - node:path, node:fs (existence check for dist/reader/reader.js)
    - pdfjs-dist legacy build and official web viewer module
    - pdf-viewer/shared/protocol (ReaderBootParams shape,
      PROTOCOL_VERSION)
    - pdf-viewer/ThemeManager for the effective theme resolution

database:
  tables_used: []
  migrations: []

events:
  emits: []
  listens: []

errors:
  expected_failures:
    - pdfjs-dist installation cannot be located on disk
    - a required pdfjs asset (worker, viewer, cmaps) is missing
    - dist/reader/reader.js is missing (bundle not built)
  handling_strategy: >
    resolvePdfjsUris returns null when pdfjs-dist cannot be located
    and the boot params carry empty asset URLs; the reader detects
    the empty URLs and shows "PDF.js viewer assets are unavailable"
    inline. When the reader bundle is missing,
    resolveReaderBundleUris returns null and generateHtml emits the
    "Reader bundle not built" static HTML instead of the reader
    shell (no <script>, no pdf.js requests) so a developer running
    `tsc --watch` alone still sees an actionable message.

ui:
  components:
    - >-
      viewer shell HTML: header preloads, CSP meta, structural
      containers only
    - >-
      boot params: <script id="labshelf-boot" type="application/json">
      containing the ReaderBootParams JSON. serializeBoot replaces
      every literal `<` with its JSON Unicode escape
      (backslash-u003c), and U+2028 / U+2029 with their escapes so
      older parsers that treat them as line terminators cannot
      choke.
    - reader bundle: <script type="module" nonce="…" src="…dist/reader/reader.js"></script>
    - pdf_viewer.css <link>, placed before the reader.css <link>
    - reader.css <link> (styleUri from resolveReaderBundleUris)
    - >-
      bundle-missing shell: a static "Reader bundle not built" page
      with a `pnpm --filter @labshelf/vscode build` hint; CSP
      restricted to default-src 'none'; style-src 'unsafe-inline'
  containers:
    - "#app"
    - "#sidebar (aria-label Sidebar, hidden by default)"
    - "#sidebar-resizer (hidden by default)"
    - "#pdf-shell (main)"
    - "#toolbar (role toolbar, aria-label Reader)"
    - "#find-bar (role search)"
    - "#viewerContainer (tabindex 0)"
    - "#viewer (class pdfViewer)"
    - "#status-pill"
    - "#loading-msg"
    - "#error-msg (role alert, hidden by default)"
    - "#selection-toolbar (role toolbar, aria-label Selection)"
    - "#hover-popup (role tooltip)"
    - "#cheatsheet"
  notes: >
    The HTML applies data-pdf-theme on the root element so theme
    switching is a CSS-only update; the variables themselves live
    in reader.css shipped with the bundle. There is no inline
    <style> block beyond the tiny inline styling used by the
    bundle-missing shell.

tests:
  unit:
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: generateHtml embeds
      the reader bundle URI with the correct nonce, along with
      modulepreload of pdfjs when resolved"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: generateHtml
      injects the effective theme as data-pdf-theme"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: generateHtml
      serializes ReaderBootParams into the labshelf-boot JSON
      block and replaces every `<` with its Unicode escape
      (backslash-u003c); serializeBoot also escapes U+2028 and
      U+2029"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: generateHtml keeps
      the CSP unchanged (default-src 'none'; script-src
      'nonce-<n>' 'wasm-unsafe-eval' <cspSource>; worker-src
      <cspSource> blob:; style-src 'unsafe-inline' <cspSource>;
      img-src <cspSource> blob: data:; connect-src <cspSource>;
      font-src <cspSource>)"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: generateHtml
      emits the 'Reader bundle not built' shell when
      dist/reader/reader.js is missing"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: resolvePdfjsUris
      returns null when pdfjs-dist cannot be located"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: resolvePdfjsUris
      converts every asset path to a webview-safe URI"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: getPdfjsDirectory
      locates the installed pdfjs-dist directory"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts:
      resolveReaderBundleUris returns null when
      dist/reader/reader.js is absent, and the script/style
      webview URIs otherwise"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: a paper title
      containing '</script>' is safe once serialized (the < is
      escaped in the JSON block AND HTML-escaped in the <title>
      tag)"
  integration:
    - PdfViewerPanel renders a real sample PDF using the generated
      HTML
    - the shim at pdf-viewer/PdfRenderer.ts exposes the same API
      as renderer/

ai_notes:
  embeddings: false
  semantic_search: false
  removed_surfaces: >
    template.js.ts and template.css.ts were removed. The theme
    presets and ThemeManager.generateThemeCss / THEME_CSS surface
    are replaced by pdf-viewer/shared/themePresets.ts (single source
    of the canvas colours) and reader.css shipped with the bundle.
  see_also:
    - pdf-viewer/reader-webview.spec.yaml (bundle pipeline, HTML
      shell details, protocol)
    - ui/pdf-reader-navigation.spec.yaml (all visible chrome and
      behaviour)
    - ui/pdf-reader-paper-resources.spec.yaml (copy with citation,
      exports, hover previews)
