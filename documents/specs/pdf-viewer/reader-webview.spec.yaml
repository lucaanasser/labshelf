  integration:
    - PdfViewerPanel replies to ready-for-init with a HostToWebview.init
      containing the current reading state, annotations, prefs, theme
      and effective theme
    - PdfViewerPanel drops malformed webview messages and logs them
    - >-
      PdfViewerPanel rejects openExternalLink for file:, command:,
      vscode: URIs, and forwards http/https/mailto to
      vscode.env.openExternal
    - the reader webview posts ready-for-init before importing pdf.js,
      so the host can respond before pagesinit and hydration happens
      on pagesinit
    - the "Reader bundle not built" shell is rendered when
      dist/reader/reader.js is absent
  manual:
    - Run pnpm --filter @labshelf/vscode build; open a paper — the
      first paint hits the shell HTML, then pdf.js loads, and
      hydration lands on pagesinit without a flicker.
    - Delete dist/reader/reader.js and open a paper — the reader
      shows "Reader bundle not built" with the pnpm hint.
    - Open a PDF whose title contains "</script>" — the boot block
      still parses (< replaced by its Unicode escape).
    - Open two papers at once — each panel has its own boot block and
      its own reading-state hydration; closing one does not affect
      the other.
    - Toggle labshelf.reader.openBeside off and reopen a paper — it
      lands in the active editor group.

ai_notes:
  embeddings: false
  semantic_search: false
  packaging_note: >
    pdfjs-dist is served directly from node_modules today. When a vsix
    is packaged, a copy step will stage the required pdfjs assets into
    dist/pdfjs and switch resolvePdfjsUris to prefer that copy. The
    reader.mjs esbuild script already keeps pdfjs external, so this
    switch will not touch the bundle.
  dependency_pin: >
    pdfjs-dist is pinned to ~6.3.289 in package.json. webview/ui/theme.ts
    reads pdfViewer._pages (private) to broadcast pageColors to already
    constructed PDFPageView instances; a version bump can rename that
    field. All other pdf.js surfaces the reader uses are public
    (PDFViewer, PDFLinkService, PDFFindController, EventBus).
  reason_typescript_version: >
    The host program compiles with the native TS 7 binary via
    typescript ^7.0.2. ts-jest cannot use TS 7 (it needs the JS API),
    so jest transforms use typescript-js ^6.0.3 via
    ts-jest's `compiler` option. .pnpmfile.cjs applies the same
    override to ts-jest's own require. The webview program
    (typecheck:webview) compiles with the same TS 7 binary.
