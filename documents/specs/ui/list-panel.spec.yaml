feature:
  name: List Panel
  module: ui
  description: >
    Central editor-area WebviewPanel that browses the library. Any folder opens
    in it — leaf or not, including papers/ itself ("All Papers"). It shows the
    folder's subfolders and papers on the left and a details sidebar on the
    right, lets the user navigate, filter, sort, and reorganize papers without
    leaving the panel, and keeps the sidebar tree selection in sync. A single
    panel instance is reused across folder switches.

structure:
  description: >
    This feature lives in ui/list/. The controller, the HTML shell, and the
    webview script are separate files. Pure navigation logic is shared with the
    tree from ui/library/.
  layout:
    ui/list/listWebviewPanel.ts: >
      WebviewPanel controller (ListWebviewPanel) — creates/reuses the panel,
      resolves the folder to show, pushes state messages, validates and handles
      webview messages.
    ui/list/template.ts: >
      Static HTML shell (buildListPanelHtml). Rendered once per panel; it
      embeds no paper data.
    ui/list/template.script.ts: >
      Webview script: renders state, breadcrumb, folder rows, filter, sort,
      selection, keyboard control, and paper drag-and-drop.
    ui/list/template.detail.script.ts: >
      Detail-pane fragment spliced into the script: paper details,
      multi-selection summary, pane collapse and resize.
    ui/library/folderNavigation.ts: >
      Pure helpers (no vscode import): breadcrumbFor, countPapersUnder,
      relativeFolder, buildListState.
    ui/library/collectionFolders.ts: >
      Disk readers: readCollectionFolders, listAllCollectionFolders.

architecture:
  rendering_model: >
    The shell HTML is assigned once. The webview posts "ready"; the host then
    posts a ListPanelState message for every folder change and every paper
    event. The webview re-renders from state, so selection, scroll position,
    the filter box, and collapsed detail sections survive updates. Paper events
    are debounced (60 ms) and overlapping loads are discarded by sequence
    number.
  inputs:
    - LibraryNode to open (undefined means papers/)
    - PaperService.listPapers results
    - readCollectionFolders for the open folder
    - paper:added, paper:updated, and paper:deleted events
    - webview messages ready, navigate, openPdf, openFolder, copyCitation,
      updateStatus, deletePaper, addPaper, newFolder, movePapers, and
      pickMoveTarget
  outputs:
    - ListPanelState messages (folder, breadcrumb, subfolders with recursive
      counts, papers with folderPath and relFolder)
    - onDidNavigate callback, used by extension.ts to reveal the folder in the
      sidebar tree
    - labshelf.openPdfViewer, revealInExplorer, clipboard writes
    - PaperService.updatePaperStatus, deletePaper, and movePapers mutations
    - labshelf.addPaperHere and labshelf.newFolder, both scoped to the folder
      being viewed
  dependencies:
    - vscode WebviewPanel API
    - core/paperService
    - core/eventBus
    - ui/library/folderNavigation
    - ui/library/collectionFolders
  trust_boundary: >
    Directory paths arriving from the webview (navigate, movePapers) are
    accepted only when they lie at or under papers/. Paper id lists are
    filtered to strings.

database:
  tables_used:
    - papers
  migrations: []

events:
  emits: []
  listens:
    - paper:added
    - paper:updated
    - paper:deleted
  notes: Listeners are detached with eventBus.off when the panel is disposed.

errors:
  expected_failures:
    - PaperService.listPapers failure while loading a folder
    - unknown paper ID in a message payload
    - requested folder deleted, renamed, or outside papers/
    - name collision in the target folder while moving papers
  handling_strategy: >
    Load errors keep the panel usable and empty. A missing or out-of-root
    folder falls back to All Papers. After a rename or move the panel follows
    its folder via followFolderMove. Move failures are reported per batch
    ("N moved, M failed — first error") and never abort the remaining papers.

ui:
  view_type: webview_panel
  panel_id: labshelfList
  design_principle: >
    The panel is a paper manager, not a file explorer (reference: Zotero's
    center and right panes). The list contains papers only. Folder structure is
    navigation chrome around it — a path in the header and a chip strip — and
    never competes with papers for list rows. Filters and actions are about
    papers: reading status, search across bibliographic fields, inline status
    changes, keywords.
  layout:
    header:
      - path with muted ancestors and the open folder as the prominent title, followed by the paper count ("visible / total" while narrowed)
      - search box with clear button
      - show-papers-from-subfolders toggle (hidden when there are no subfolders; persisted)
      - new-subfolder button, + Add (imports into the open folder), details toggle
    filter_bar:
      - status tabs All / Unread / Reading / Done, each with the count of papers in scope
      - subfolder chips with recursive counts; click opens, dropping papers moves them; the strip scrolls horizontally and disappears when there are none
    list_pane:
      - sortable column heads Title, Creator, Year, Publication, Status (key and direction persisted); Publication is dropped below 860px
      - paper rows only, expandable to the PDF attachment; double-click opens the PDF
      - the status badge is a button that cycles unread → reading → done, applied optimistically
      - papers from subfolders carry a location chip that navigates to their folder
      - an empty folder whose papers all sit in subfolders says so and offers to show them
    detail_pane:
      - head: title, authors, "publication · year", then the actions (Open PDF, Copy Key, Move to…, Show Folder, Remove) and a segmented status control
      - sections in reading-triage order: Abstract (truncated past 320 chars with Show more), Keywords (each one searches on click), Info (including the holding folder as a link), Attachment, Notes, Tags, Related; collapsed state persisted
      - multi-selection head with Move to… and a bulk status control
  filtering: >
    Search uses space-separated tokens, all of which must match title, authors,
    year, cite key, journal, publisher, keywords, or relative folder. It always
    covers the whole subtree of the open folder regardless of the subfolder
    toggle and highlights matches. Status tabs narrow the papers in scope and
    count against that scope. Navigating clears both.
  selection: >
    Click selects one paper, Ctrl/Cmd-click toggles, Shift-click selects a
    range. Selection survives state refreshes; ids that disappeared are pruned.
    Changing a status inline does not change the selection.
  keyboard:
    - "/ or Ctrl/Cmd+F: focus search; any printable key types into it"
    - "Esc: clear search and status tab"
    - "Up/Down, Home/End: move through papers; Shift extends the selection"
    - "Enter: open the paper's PDF"
    - "Alt+Up: go to the parent folder"
    - "Ctrl/Cmd+A: select all visible papers"
  drag_and_drop:
    internal:
      supported: true
      note: >
        Selected paper rows can be dragged onto a subfolder chip or a non-current
        path segment to move them (movePapers); every drop zone is outlined
        while a drag is in progress. A webview cannot drag
        into the native sidebar tree; Move to… covers arbitrary destinations.
    os_file_drop:
      supported: false
      note: >
        The panel does not accept file drops. VS Code intercepts drags from its
        own explorer and would open the file in an editor, so drag-and-drop
        import is handled only by the sidebar library tree
        (see sidebar spec / LibraryDragAndDropController). The empty state tells
        the user to drop PDFs onto a tree folder rather than onto the panel.

tests:
  unit:
    - breadcrumbFor lists ancestors root-first and rejects paths outside papers/
    - countPapersUnder counts recursively and ignores prefix look-alikes
    - buildListState returns own and nested papers, relFolder, and counted subfolders
    - buildListPanelHtml renders the navigation shell and nonce-locked script
    - buildListScript output is syntactically valid JavaScript
    - empty-state markup directs drag-and-drop to the sidebar tree
    - the script renders subfolders as chips and never as list rows
  integration:
    - state is pushed only after the webview "ready" handshake
    - a folder with subfolders opens and lists them
    - navigate reuses the same HTML and calls onDidNavigate
    - navigate and movePapers reject directories outside papers/
    - a deleted folder falls back to All Papers
    - addPaper and newFolder target the folder being viewed
    - move failures are surfaced; the move picker offers every folder
    - followFolderMove keeps the panel on a renamed ancestor's child
    - dispose detaches event listeners
  manual:
    - Click a folder that has subfolders in the sidebar; the panel opens it, lists its papers, and shows the subfolders as chips.
    - Open a subfolder from the panel; the sidebar tree expands and selects it.
    - Type while the list is focused; the filter narrows papers across subfolders.
    - Drag two selected papers onto a subfolder chip; both move and counts update in tree and panel.
    - Click a status badge in a row; it cycles and the status tab counts follow without losing selection or scroll.

ai_notes:
  embeddings: false
  semantic_search: false
