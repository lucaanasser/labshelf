feature:
  name: PDF Viewer - Host Panel (Extension Side)
  module: pdf-viewer
  description: >
    Host-side lifecycle for the PDF reader. PdfViewerPanel creates
    the WebviewPanel, resolves pdf.js and reader-bundle assets, hands
    the reader webview a boot payload, dispatches typed messages
    between the reader and the extension host, forwards configuration
    and theme changes, and emits open/close events. The visible
    reader UI (toolbar, sidebar, find, zoom, keyboard, hover previews,
    exports) is documented in ui/pdf-reader-navigation.spec.yaml and
    ui/pdf-reader-paper-resources.spec.yaml. The bundled runtime
    layout, HTML shell, and message protocol live in
    pdf-viewer/reader-webview.spec.yaml.

architecture:
  inputs:
    - PdfViewerDeps { extensionUri, eventBus, themeManager,
      annotationManager, readingStore?, logger?, onReadingEvent? }
      passed to createOrShow
    - PaperRecord (id, path, title, citeKey, authors, year, status)
    - >-
      OpenOptions { page?: number } for scrollToPage on the first
      "ready" reply
    - VS Code active color theme (via
      vscode.window.activeColorTheme, forwarded through
      ThemeManager)
    - labshelf.reader.* configuration (via readerPrefs.ts;
      change events via vscode.workspace.onDidChangeConfiguration)
    - HostToWebview messages posted by the reader
  outputs:
    - WebviewPanel of viewType READER_VIEW_TYPE ('labshelfPdf')
      opened at getReaderViewColumn() (ViewColumn.Two when
      labshelf.reader.openBeside is not false; ViewColumn.Active
      otherwise)
    - webview.html assigned once by PdfRenderer.generateHtml
      (bundle-missing shell when dist/reader/reader.js is absent)
    - HostToWebview.init in response to WebviewToHost.ready-for-init,
      carrying { reading, annotations, prefs, theme, effectiveTheme }
    - HostToWebview.applyTheme when the VS Code theme changes and
      the paper theme is 'auto', or when the reader posts
      selectTheme
    - HostToWebview.prefsChanged when the READER_CONFIG_SECTION is
      affected in a configuration change
    - HostToWebview.updateAnnotations after every mutation
    - HostToWebview.scrollToPage when a subsequent createOrShow call
      arrives with { page } for an already-open paper
    - HostToWebview.command via PdfViewerPanel.postToActive for
      contributed keybindings
    - PDF_VIEWER_OPENED event on creation
    - PDF_VIEWER_CLOSED event on dispose (paperId, currentPage,
      timestamp; runs exactly once thanks to the _closed guard)
    - annotations mutations forwarded to AnnotationManager
    - reading-state writes forwarded to
      PaperDataStore.setReadingState (per-paper write queue)
    - reading_events forwarded to deps.onReadingEvent
      (aiService?.recordReadingEvent), covering open/close/scroll/annotate
    - clipboard writes (copyWithCitation, copyText)
    - annotations Markdown export (clipboard or file via
      showSaveDialog with defaultUri <paper.path>/annotations.md,
      opens the file beside the reader on success)
    - vscode.env.openExternal calls for openExternalLink (guarded
      by isSafeExternalUrl)
  dependencies:
    - vscode WebviewPanel API
    - pdfjs-dist ~6.3.289 (legacy build for pdf.min.mjs +
      pdf.worker.min.mjs and web/pdf_viewer.mjs +
      web/pdf_viewer.css)
    - core/paperService for the PaperRecord (used only via
      extension.ts wiring; PdfViewerPanel itself does not call it)
    - core/eventBus for event emission
    - storage/data/paperDataStore (annotations + reading state)
    - pdf-viewer/AnnotationManager (annotation CRUD)
    - pdf-viewer/ThemeManager for VS Code theme mapping
    - pdf-viewer/readerPrefs for labshelf.reader.* settings
    - pdf-viewer/renderer/PdfRenderer for the HTML shell (see
      renderer.spec.yaml)
    - pdf-viewer/shared/protocol (message validators, guards)
    - pdf-viewer/shared/annotationsMarkdown +
      pdf-viewer/shared/citationFormat (pure formatters)
    - ai/service/aiService (optional callback for reading_events)
  notes: >
    PdfViewerPanel does not embed viewer scripts. It renders the
    HTML shell once, waits for WebviewToHost.ready-for-init, replies
    with HostToWebview.init, and thereafter dispatches the typed
    protocol via a switch(msg.command) guarded by isWebviewMessage.
    A single PdfViewerPanel instance is kept per paperId in an
    internal map so a subsequent createOrShow reveals the existing
    panel (and posts scrollToPage when options.page is set).
    localResourceRoots is restricted to three roots:
    getReaderBundleDirectory(extensionUri) (i.e.
    extensionUri/dist/reader), the paper folder, and the pdfjs-dist
    directory. The static activePanel reference is synced from
    onDidChangeViewState so postToActive targets the focused reader.

database:
  tables_used: []
  migrations: []

events:
  emits:
    - PDF_VIEWER_OPENED (paperId, timestamp)
    - PDF_VIEWER_CLOSED (paperId, currentPage, timestamp)
  listens: []

errors:
  expected_failures:
    - PDF file not found or inaccessible (surfaced by the reader as
      an inline #error-msg after pdfLoader.describeLoadError)
    - Invalid PDF bytes / 0-byte file (bespoke message from
      describeLoadError)
    - PDF.js worker source resolution fails (fallback path from
      legacy to non-legacy)
    - Webview creation fails (out of memory, permissions)
    - Reader bundle missing (renderer emits the "Reader bundle not
      built" page instead of an empty webview)
    - Malformed webview messages (dropped by isWebviewMessage;
      logged WARN)
    - Unsafe external URL (rejected by isSafeExternalUrl; logged
      WARN)
    - Double disposal from a reveal-then-close sequence (guarded by
      _closed and _disposed)
  handling_strategy: >
    File / bytes errors surface inline in #error-msg via
    describeLoadError; the webview stays alive so users see what
    happened. Worker fallback resolvers try legacy then non-legacy.
    Malformed webview messages are logged and dropped. Unsafe URLs
    are dropped by isSafeExternalUrl. The reader bundle missing
    fallback renders a self-contained HTML page with no script.
    Double disposal is idempotent (_closed / _disposed).

ui:
  components:
    - PdfViewerPanel: host-side WebviewPanel controller
    - >-
      reader bundle: dist/reader/reader.js (all visible chrome —
      overlay toolbar, left sidebar with three tabs, bottom-right
      status pill, theme popover, in-page find, cheatsheet)
    - PDF.js official viewer container (`#viewerContainer` +
      `.pdfViewer`)
  notes: >
    All visible chrome is inside the bundled reader webview. See
    ui/pdf-reader-navigation.spec.yaml for the layout and behaviour.
    The old top toolbar (page input, first/prev/next/last, Unicode-
    arrow buttons, zoom dropdown, theme dropdown, background/text
    color pickers, Notes toggle) and the right annotations sidebar
    have been removed. Annotations live in the left sidebar's
    Annotations tab. The two color pickers moved into the theme
    popover's "Custom" section.

tests:
  unit:
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: createOrShow
      creates the webview with viewType READER_VIEW_TYPE
      ('labshelfPdf'), retainContextWhenHidden true, and
      localResourceRoots restricted to [dist/reader, paper folder,
      pdfjs-dist root]"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: the shell HTML is
      assigned once via PdfRenderer.generateHtml"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: replies to
      WebviewToHost.ready-for-init with a HostToWebview.init
      containing the current reading state, annotations, prefs,
      theme and effectiveTheme"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: dispatches
      messages through isWebviewMessage and drops anything that
      fails validation (logged WARN)"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: handles
      saveReadingState by writing through
      PaperDataStore.setReadingState (the store queues the write)"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: formats
      copyWithCitation in each of the four styles and writes to
      vscode.env.clipboard"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: handles
      exportAnnotations for target 'clipboard' and 'file'
      (showSaveDialog + workspace.fs.writeFile), then opens the
      file preview beside the reader"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: rejects
      openExternalLink for file:, command:, vscode:, and forwards
      http/https/mailto to vscode.env.openExternal"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: postToActive
      posts { type:'command', id } to the panel currently marked
      active by onDidChangeViewState"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: dispose runs
      the close-out block exactly once (double onDidDispose is
      idempotent)"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: OpenOptions.page
      is posted as scrollToPage on the reader's first ready reply,
      or immediately when a subsequent createOrShow reveals an
      existing panel"
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts: the panel emits
      reading_events for open / close / scroll dwell (>= 5000 ms) /
      annotate through deps.onReadingEvent, and stops counting
      dwell while the panel is hidden"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: HTML shell (see
      renderer.spec.yaml)"
    - "__tests__/pdf-viewer/ThemeManager.test.ts: VS Code kind
      mapping and PaperDataStore persistence"
    - "__tests__/pdf-viewer/AnnotationManager.test.ts: CRUD +
      events"
  integration:
    - opening a paper creates one PdfViewerPanel and reveals it on
      subsequent calls (scrollToPage on the second call)
    - closing the panel emits PDF_VIEWER_CLOSED with the last known
      page
    - Theme changes in VS Code push applyTheme when the paper theme
      is 'auto'
    - Multiple papers can be opened and closed sequentially without
      leaking listeners
    - onDidChangeConfiguration for READER_CONFIG_SECTION pushes
      prefsChanged to every open reader
  fixtures:
    - __tests__/fixtures/sample-valid.pdf (simple scientific paper)
    - __tests__/fixtures/sample-corrupted.pdf (invalid header)

ai_notes:
  embeddings: false
  semantic_search: false
  migration_notes: >
    The template-string webview runtime (renderer/template.js.ts +
    renderer/template.css.ts) has been removed. All viewer behaviour
    is now in the esbuild bundle at dist/reader/reader.js — see
    pdf-viewer/reader-webview.spec.yaml. The host panel now owns
    only the WebviewPanel lifecycle and the typed message
    dispatcher.
  performance_notes: >
    First paint depends only on the shell HTML being assigned; the
    reader bundle loads pdf.js asynchronously. The bundle sets
    canvas caps (maxCanvasPixels 2**25, capCanvasAreaFactor 200,
    maxCanvasDim 32767, enableDetailCanvas true) and clamps scale
    to [0.25, 8] to keep memory bounded even on HiDPI displays. See
    pdf-viewer/reader-webview.spec.yaml.
  worker_resolution_critical: >
    The PDF.js worker MUST be explicitly resolved in the extension
    host via require.resolve on both the legacy and non-legacy
    paths. The webview turns the resolved URL into a Blob URL
    because VS Code's webview service worker cannot route
    worker-originated requests. Same reason applies to PDF bytes,
    which the webview fetches in the page and passes to
    getDocument as `data` with useWorkerFetch: false.
  see_also:
    - pdf-viewer/reader-webview.spec.yaml
    - ui/pdf-reader-navigation.spec.yaml
    - ui/pdf-reader-paper-resources.spec.yaml
