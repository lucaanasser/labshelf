feature:
  name: PDF Reader Webview (Bundled Runtime)
  module: pdf-viewer
  description: >
    Architecture of the bundled PDF reader webview. The reader runtime is
    real TypeScript, packaged with esbuild into dist/reader/reader.{js,css}
    and loaded from a minimal HTML shell rendered by the extension host.
    This spec covers the module layout, the build pipeline, the HTML
    shell, pdf.js loading, the typed host<->webview protocol, and the
    boot handshake. Feature-level behaviour (toolbar, sidebar, find,
    zoom, keyboard, hover previews, citation export) is covered by
    ui/pdf-reader-navigation.spec.yaml and
    ui/pdf-reader-paper-resources.spec.yaml.

structure:
  description: >
    The pdf-viewer module has three logical layers. The host layer
    (PdfViewerPanel, PdfRenderer, ThemeManager, AnnotationManager,
    readerPrefs) runs in the extension host. The shared layer is DOM-free
    and vscode-free so both TypeScript programs (host and webview) plus
    jest can compile it. The webview layer is split into pure logic
    (jest-tested with the node env) and DOM-touching UI (excluded from
    the main tsc program and from jest coverage).
  layout:
    packages/vscode/build/reader.mjs: >
      Node script that runs esbuild. Entry:
      src/pdf-viewer/webview/main.ts. Output: dist/reader/reader.{js,css}.
      Options: bundle true, format esm, platform browser, target
      ["chrome122"], external ["pdfjs-dist","pdfjs-dist/*"]. Flags:
      --watch (esbuild context), --production (minify + no sourcemap).
      Sourcemap is inline in dev. tsconfig is
      src/pdf-viewer/webview/tsconfig.json. The output directory is
      recreated on every non-watch run.
    packages/vscode/dist/reader/: >
      Bundle output. dist/ is git-ignored. Rebuilt by build:webview or
      watch:webview.
    packages/vscode/src/pdf-viewer/shared/: >
      DOM-free, vscode-free helpers compiled by both the host tsconfig
      and the webview tsconfig, and tested by jest.
    packages/vscode/src/pdf-viewer/shared/protocol.ts: >
      HostToWebview / WebviewToHost unions, ReaderBootParams,
      ReaderPrefs, ReaderCommandId, PROTOCOL_VERSION,
      DEFAULT_READER_PREFS, ReaderAssets, isWebviewMessage(),
      isSafeExternalUrl().
    packages/vscode/src/pdf-viewer/shared/readingState.ts: >
      ReadingState / SidebarState types, MIN_SIDEBAR_WIDTH,
      MAX_SIDEBAR_WIDTH, normalizeReadingState(), clampPage().
    packages/vscode/src/pdf-viewer/shared/themePresets.ts: >
      Single source of the page-pixel colours each theme hands to
      pdf.js pageColors: THEME_PRESETS map for light/dark/sepia/
      high-contrast, presetFor(theme), toPageColors(bg,text) (returns
      null for the identity #ffffff/#000000 pair so light rendering
      matches the PDF's own colours). Consumed by ThemeManager,
      viewerSetup.ts (initial pageColors) and webview/ui/theme.ts.
    packages/vscode/src/pdf-viewer/shared/annotationsMarkdown.ts: >
      Pure formatAnnotationsMarkdown(paper, annotations). Emits the
      layout documented in pdf-reader-paper-resources.spec.yaml.
    packages/vscode/src/pdf-viewer/shared/citationFormat.ts: >
      Pure cleanQuote(), authorYearLabel(), formatQuoteWithCitation().
      CitablePaper is Pick<PaperRecord, "citeKey"|"title"|"authors"|"year">.
    packages/vscode/src/pdf-viewer/webview/tsconfig.json: >
      lib ["ES2022","DOM","DOM.Iterable"], types [], module ESNext,
      moduleResolution "Bundler", noEmit true, include
      ["./**/*","../shared/**/*"]. Not the main program's tsconfig; the
      main tsconfig excludes src/pdf-viewer/webview/main.ts and
      src/pdf-viewer/webview/ui/** so DOM types never leak into host
      code.
    packages/vscode/src/pdf-viewer/webview/main.ts: >
      Bundle entry. Installs polyfills, parses the boot JSON, opens the
      HostBridge, posts { command: "ready-for-init" } before any pdf.js
      import, listens for the "init" and "applyTheme" messages, then
      runs start() which loads pdf.js, creates the viewer, wires
      toolbar/sidebar/pill/find/hover, applies the reader action switch
      to the Keyboard, restores position on pagesinit, and reports
      "perf" once the first page has rendered.
    packages/vscode/src/pdf-viewer/webview/polyfills.ts: >
      Chromium 122 already ships every runtime pdf.js needs; kept so a
      future polyfill can be added without touching main.ts.
    packages/vscode/src/pdf-viewer/webview/globals.d.ts: >
      Ambient module declaration for "*.css" so the reader stylesheet
      import type-checks.
    packages/vscode/src/pdf-viewer/webview/styles/reader.css: >
      Reader stylesheet imported by main.ts; esbuild copies it out as
      dist/reader/reader.css. Loaded via a plain <link> in the HTML
      shell too. INVARIANT: its `box-sizing: border-box` reset must
      not reach pdf.js' DOM — it is written
      `:where(:not(#viewer, #viewer *))` (plus ::before/::after).
      pdf.js declares .page as a content box with a 9px transparent
      border and gives the text and annotation layers that same
      declared size; as a border box the page shrinks its canvas
      alone (18px each way), so hover, selection and link hit areas
      drift from the ink — a full text line by the foot of a page.
      Check: canvas, .textLayer and .annotationLayer of a page must
      have identical bounding boxes.
    packages/vscode/src/pdf-viewer/webview/logic/: >
      Pure modules with no DOM or vscode reference. Included in the
      main tsc program and covered by jest. Files: keymap.ts,
      zoomMath.ts, historyStack.ts, debounce.ts, autohide.ts,
      citationMarkers.ts, referenceList.ts, textLines.ts,
      destGeometry.ts, outlineModel.ts, findScroll.ts, actionDedupe.ts.
    packages/vscode/src/pdf-viewer/webview/ui/: >
      DOM-touching modules. Excluded from the main tsc program via
      exclude in packages/vscode/tsconfig.json and from jest coverage
      via jest.config.js collectCoverageFrom. Compiled only by esbuild.
      Files: context.ts, hostBridge.ts, dom.ts, icons.ts, popover.ts,
      pdfLoader.ts, viewerSetup.ts, theme.ts, themePopover.ts,
      toolbar.ts, sidebar.ts, thumbnailsTab.ts, outlineTab.ts,
      annotationsTab.ts, findBar.ts, statusPill.ts, zoomController.ts,
      navHistory.ts, keyboard.ts, cheatsheet.ts, selectionBubble.ts,
      hoverPreview.ts, destPreview.ts, citationResolver.ts,
      readingStateReporter.ts, focusGuard.ts.
    packages/vscode/src/pdf-viewer/renderer/PdfRenderer.ts: >
      Reduced to the HTML shell builder plus pdfjs and reader-bundle
      URI resolution. See renderer.spec.yaml.
    packages/vscode/src/pdf-viewer/readerPrefs.ts: >
      Host-side loader for labshelf.reader.* configuration.
      READER_CONFIG_SECTION, getReaderPrefs(), getReaderViewColumn().
      hoverDelayMs is clamped to [0, 2000]. openBeside is NOT part of
      ReaderPrefs; it is read separately by getReaderViewColumn to pick
      ViewColumn.Two or ViewColumn.Active.
  rule_dom_free_logic: >
    Files under webview/logic/ MUST NOT import DOM globals, vscode, or
    pdfjs-dist runtime values. Only type-only imports from pdfjs-dist
    are allowed. This is what lets jest run them under the node
    environment without jsdom and keeps the main tsc program buildable
    without lib "DOM".
  rule_ui_isolation: >
    webview/ui/**/* and webview/main.ts are excluded from the main tsc
    program (packages/vscode/tsconfig.json exclude) and from jest
    coverage (jest.config.js collectCoverageFrom). Only esbuild
    compiles them, and only the manual verification checklist
    exercises them at runtime.

architecture:
  inputs:
    - >-
      RenderParams from PdfViewerPanel: { webview, extensionUri, pdfUri,
      paperId, paperTitle, themeManager, themePreference, prefs }
    - resolved pdfjs-dist installation on disk (legacy or non-legacy
      build)
    - dist/reader/reader.js + reader.css produced by esbuild
    - HostToWebview messages arriving via webview.onDidReceiveMessage
      (see events.listens)
  outputs:
    - HTML shell assigned once to webview.html
    - WebviewToHost messages posted via acquireVsCodeApi().postMessage
      (see events.emits)
    - dist/reader/ artifacts written by build:webview
  dependencies:
    - esbuild (dev dependency)
    - pdfjs-dist ~6.3.289 (see ai_notes.dependency_pin)
    - vscode Webview API (cspSource, asWebviewUri, postMessage)
    - shared/protocol, shared/readingState, shared/themePresets
  bundle_pipeline:
    entry: src/pdf-viewer/webview/main.ts
    output_dir: packages/vscode/dist/reader
    output_files:
      - reader.js
      - reader.css
    externals: ["pdfjs-dist", "pdfjs-dist/*"]
    reason_external: >
      pdf.js is loaded at runtime by dynamic import() against webview
      URIs. A value import would silently pull ~1 MB into the bundle
      and would break because pdfjs-dist expects a specific module URL.
      Only its types are imported via `import type`.
    package_scripts:
      compile: pnpm run build
      build: pnpm run build:host && pnpm run build:webview
      build:host: tsc -p ./
      build:webview: node build/reader.mjs
      watch: tsc -watch -p ./
      watch:webview: node build/reader.mjs --watch
      typecheck: tsc --noEmit -p ./ && pnpm run typecheck:webview
      typecheck:webview: tsc --noEmit -p src/pdf-viewer/webview/tsconfig.json
      vscode:prepublish: pnpm run build:host && node build/reader.mjs --production
    dev_dependency_added: esbuild ^0.24.0
    tsconfig_root_exclude:
      - src/pdf-viewer/webview/ui/**
      - src/pdf-viewer/webview/main.ts
    tsconfig_root_include_shared: >
      src/pdf-viewer/shared/**/* stays inside the main program so
      PdfViewerPanel, ThemeManager and PaperDataStore can import from
      it.
    jest_config_exclude: >
      collectCoverageFrom drops src/pdf-viewer/webview/ui/** and
      src/pdf-viewer/webview/main.ts. webview/logic/ and shared/ stay
      covered.
  pdfjs_loading:
    source: >
      pdfjs-dist is served from node_modules through webview URIs by
      resolvePdfjsUris in renderer/PdfRenderer.ts. The reader bundle
      calls dynamic import() on those URIs at runtime; only types come
      from pdfjs-dist at build time.
    entry_files:
      - pdfjs-dist/legacy/build/pdf.min.mjs (falls back to pdfjs-dist/build/pdf.min.mjs)
      - pdfjs-dist/legacy/build/pdf.worker.min.mjs (falls back to non-legacy)
      - pdfjs-dist/legacy/web/pdf_viewer.mjs
      - pdfjs-dist/legacy/web/pdf_viewer.css
    global_variable: >
      pdf_viewer.mjs reads pdfjsLib off globalThis; pdfLoader.ts sets
      globalThis.pdfjsLib after importing pdf.min.mjs and before
      importing pdf_viewer.mjs.
    worker_strategy: >
      The webview fetches the worker source itself and constructs a
      Blob URL, then assigns
      pdfjsLib.GlobalWorkerOptions.workerPort = new Worker(<blob URL>,
      { type: "module" }). This works around VS Code's webview service
      worker being unable to route worker-originated requests.
    pdf_bytes_strategy: >
      The PDF bytes are fetched in the webview page (fetch() against
      the webview URI of paper.pdf) and handed to getDocument as
      `data`, with useWorkerFetch: false, cMapPacked: true,
      useSystemFonts: true, isEvalSupported: true, enableHWA: true.
      Same reason as the worker: the service worker in the webview
      cannot route worker-originated requests, so the worker must
      never fetch by URL. The base URLs for cmaps, standard fonts,
      wasm and iccs are still passed so pdf.js can build the request
      URLs used from the page.
    canvas_caps:
      maxCanvasPixels: 33554432   # 2**25 (~33.5 Mpx)
      capCanvasAreaFactor: 200
      maxCanvasDim: 32767
      enableDetailCanvas: true
      enableHWA: true
      scale_clamp: [0.25, 8]   # MIN_SCALE / MAX_SCALE in zoomMath.ts
      rationale: >
        Uncapped canvases at 8x on a HiDPI display allocate hundreds
        of megapixels per page and freeze the webview. The caps and
        clamp are the safe defaults for pdf.js 6.3.x. If sharper
        output is ever needed, tune here rather than removing the
        caps.
  html_shell:
    owner: renderer/PdfRenderer.ts (see renderer.spec.yaml)
    csp: >
      default-src 'none';
      script-src 'nonce-<n>' 'wasm-unsafe-eval' <cspSource>;
      worker-src <cspSource> blob:;
      style-src 'unsafe-inline' <cspSource>;
      img-src <cspSource> blob: data:;
      connect-src <cspSource>;
      font-src <cspSource>;
    head_preloads:
      - modulepreload of pdf.min.mjs (webview URI) if resolved
      - modulepreload of pdf_viewer.mjs (webview URI) if resolved
      - modulepreload of dist/reader/reader.js (webview URI, always)
      - preload of pdf.worker.min.mjs (as="fetch", crossorigin="anonymous")
      - preload of the paper's paper.pdf (as="fetch", crossorigin="anonymous")
      - link rel="stylesheet" href="<pdf_viewer.css>" placed before reader.css
      - link rel="stylesheet" href="<dist/reader/reader.css>"
    boot_block: >
      A single <script id="labshelf-boot" type="application/json"> block
      whose textContent is JSON.stringify(bootParams). serializeBoot()
      replaces every `<` with its Unicode escape (backslash-u003c),
      and U+2028 / U+2029 with their escapes so older parsers that
      treat them as line terminators do not choke. Content matches
      ReaderBootParams from shared/protocol.ts.
    body_structure: >
      Only structural containers. No buttons or user-visible strings
      live in the HTML — every control is created by the bundle. The
      bundle relies on these container ids: #app, #sidebar,
      #sidebar-resizer, #pdf-shell, #toolbar, #find-bar,
      #viewerContainer (tabindex 0), #viewer (class pdfViewer),
      #status-pill, #loading-msg, #error-msg (role alert, hidden),
      #selection-toolbar (role toolbar), #hover-popup (role tooltip),
      #cheatsheet. Themes are applied via data-pdf-theme on
      documentElement.
    missing_bundle_fallback: >
      If dist/reader/reader.js is not present when the panel opens,
      resolveReaderBundleUris returns null and generateHtml emits a
      static "Reader bundle not built" page (heading plus a
      `pnpm --filter @labshelf/vscode build` hint). It uses a minimal
      CSP (default-src 'none'; style-src 'unsafe-inline') and no
      script tag, so a checkout compiled with `tsc` alone never shows
      a blank webview.
    resource_roots: >
      localResourceRoots restricted to three roots: the reader bundle
      folder (getReaderBundleDirectory(extensionUri) →
      extensionUri/dist/reader), the paper folder, and the pdfjs-dist
      directory (getPdfjsDirectory()). Everything else the panel needs
      is served from one of these.
    find_widget: >
      The panel is created without setting enableFindWidget. Turning
      it on would let VS Code's Ctrl/Cmd+F steal focus and search the
      webview's DOM instead of the PDF text; the reader has its own
      in-webview find bar.
  handshake:
    step_1_ready_for_init: >
      The webview bundle posts { command: "ready-for-init" } as one of
      the first synchronous statements in main.ts (before pdf.js is
      imported).
    step_2_host_init: >
      PdfViewerPanel receives ready-for-init and calls _sendInit,
      which resolves in parallel:
        themeManager.getThemeForPaper(paperId),
        annotationManager.getAnnotationsByPaper(paperId),
        readingStore?.getReadingState(paperId) (default null),
      then posts a single
      { type: "init", reading, annotations, prefs, theme,
        effectiveTheme }
      message.
    step_3_hydrate_on_pagesinit: >
      The webview buffers the init payload and waits for pdf.js to
      emit "pagesinit". On pagesinit it applies the default zoom
      preference, forces container.scrollTop = 0 (pdf.js aligns page
      one with the container top, which is underneath the overlay
      toolbar; the reset puts page one below it), calls
      host.post({ command: "ready", totalPages }), then (given both
      are ready) applies theme, annotations, restores the reading
      state and starts the ReadingStateReporter. First paint is
      therefore not blocked on the init reply.
    restore_semantics: >
      When labshelf.reader.restorePosition is true and the payload has
      a `reading` state, main.ts sets pdfViewer.currentScaleValue to
      the stored scaleValue, then calls scrollPageIntoView with a
      destArray [null, {name:"XYZ"}, left ?? null, top, null] and
      allowNegativeOffset true when top is defined. Sidebar restore
      calls sidebar.restore(state.sidebar) and updates the toolbar
      toggle. On a fresh open (no stored position) the container's
      scrollTop=0 reset above places page one immediately below the
      overlay toolbar.
  protocol:
    reference: shared/protocol.ts
    webview_to_host_discriminant: command
    host_to_webview_discriminant: type
    webview_to_host_variants:
      - ready-for-init
      - ready { totalPages }
      - perf { timeline, pageNumber, theme, dpr, canvas }
      - pageChanged { pageNumber }
      - zoomChanged { zoomLevel }       # accepted but superseded by saveReadingState
      - selectTheme { theme }
      - createAnnotation { type: highlight|note, pageNumber, content, color?, position? }
      - deleteAnnotation { id }
      - updateAnnotation { id, content }
      - saveReadingState { state: ReadingState }
      - copyWithCitation { text, pageNumber }
      - copyText { text }
      - exportAnnotations { target: clipboard|file }
      - openExternalLink { url }
    host_to_webview_variants:
      - init { reading, annotations, prefs, theme, effectiveTheme }
      - applyTheme { theme, effectiveTheme }
      - updateAnnotations { annotations }
      - scrollToPage { pageNumber }
      - prefsChanged { prefs }
      - command { id: ReaderCommandId }
    reader_command_ids:
      - zoomIn
      - zoomOut
      - zoomReset
      - find
      - historyBack
      - historyForward
      - toggleSidebar
    validation: >
      All webview messages pass through isWebviewMessage in
      shared/protocol.ts before the host dispatcher runs. Malformed
      messages are dropped silently and logged at WARN level via
      logger.log("WARN", "pdf-viewer", "Ignored malformed reader
      message", { paperId }).
    external_url_guard: >
      openExternalLink is opened via vscode.env.openExternal only when
      isSafeExternalUrl returns true (http:, https:, mailto:). Other
      schemes (file:, command:, vscode:, javascript:, data:) are
      rejected and logged at WARN.

database:
  tables_used: []
  migrations: []
  notes: >
    The reader webview does not read or write SQLite directly. Reading
    position is persisted via PaperDataStore into the sidecar
    (.research/papers/<id>/data.json); see storage/storage.spec.yaml.
    reading_events are appended by AiService when the host receives
    onReadingEvent callbacks from the panel (see PdfViewerPanel).

events:
  emits:
    - PDF_VIEWER_OPENED (paperId, timestamp) — emitted by PdfViewerPanel on activation
    - PDF_VIEWER_CLOSED (paperId, currentPage, timestamp) — emitted on dispose (guarded to run exactly once)
  listens:
    - vscode.window.onDidChangeActiveColorTheme (host; forwarded to
      the webview as an applyTheme message when the paper theme is auto)
    - vscode.workspace.onDidChangeConfiguration (host; when
      READER_CONFIG_SECTION is affected, the host posts prefsChanged
      to every open reader panel)
    - >-
      pdf.js EventBus: pagesinit, pagerendered, pagechanging,
      updateviewarea, scalechanging, updatefindmatchescount,
      updatefindcontrolstate (webview-side)
  notes: >
    Reading-position dwell events (open, close, scroll) are not sent
    through the extension EventBus. PdfViewerPanel calls
    deps.onReadingEvent (passed by extension.ts as
    aiService?.recordReadingEvent) with { paperId, occurredAt, kind:
    "open" | "close" | "scroll" | "annotate", page?, durationMs? }.
    The scroll event carries the dwell time of the page just left,
    and is only emitted when the dwell was at least 5000 ms AND the
    panel was visible during that time (background time is
    subtracted by resetting _pageEnteredAt on visibility flips).

errors:
  expected_failures:
    - dist/reader/reader.js missing (bundle not built)
    - pdfjs-dist cannot be located on disk
    - PDF file is 0 bytes or corrupt
    - webview posts a malformed message (rejected by isWebviewMessage)
    - openExternalLink receives a non-web scheme
    - dynamic import of pdfjs-dist rejects (network or path error)
    - dispose fires twice (double onDidDispose during reveal-then-close)
  handling_strategy: >
    Missing bundle → the "Reader bundle not built" static HTML shell
    replaces the reader HTML (no script tag is emitted). Missing pdfjs
    → resolvePdfjsUris returns null and the boot params carry empty
    URIs; the webview reports "PDF.js viewer assets are unavailable"
    inline in #error-msg and stops. 0-byte PDFs are detected in
    describeLoadError and shown as "This paper's stored PDF is empty
    (0 bytes)". Malformed messages are dropped by isWebviewMessage and
    logged. Unsafe external URLs are rejected before
    vscode.env.openExternal is called. Dispose is idempotent thanks
    to a _closed guard around the close-out block (recordDwell,
    reading_events emit, EventBus emit, panel-map cleanup); the inner
    dispose() has its own _disposed guard.

ui:
  scope: >
    This spec is about the runtime skeleton and the message contract.
    All user-visible surfaces (toolbar, sidebar tabs, status pill,
    popovers, hover cards, cheatsheet) are documented in
    ui/pdf-reader-navigation.spec.yaml and
    ui/pdf-reader-paper-resources.spec.yaml.
  panel_id: labshelfPdf (exported as READER_VIEW_TYPE from PdfViewerPanel.ts)
  view_column: getReaderViewColumn() (ViewColumn.Two when labshelf.reader.openBeside is not false, ViewColumn.Active otherwise)
  retain_context_when_hidden: true
  reason_retain_context: >
    Reopening a paper without losing pdf.js state (rendered canvases,
    text layer, virtualization) is what makes navigation feel fluid.
    Combined with the canvas caps, thumbnail teardown, and preview
    LRU documented in the navigation spec, this stays within the
    reader's memory budget. No proactive cleanup on document.hidden
    is needed: pdfViewer.cleanup() only resets unfinished page
    renders, and pdf.js's own bounded page-view buffer already caps
    the number of live canvases.
  active_panel_tracking: >
    PdfViewerPanel keeps a static activePanel reference synced from
    onDidChangeViewState. PdfViewerPanel.postToActive(id) posts
    { type: "command", id } to that panel, used by the
    labshelf.reader.* host commands. The bundle installs
    installTextLayerFocusGuard() at the very top of main.ts: it
    wraps HTMLElement.prototype.focus so any element with class
    "textLayer" is focused with { preventScroll: true }. Reason:
    after a link is followed, PDFLinkService focuses the destination
    page's text layer once it renders; if the reader has already
    pressed Back by then that late focus would drag the view back
    to the destination, and it could nudge the precise XYZ position
    even when the reader stayed. The focus itself is kept for
    assistive technology.

tests:
  unit:
    - "__tests__/pdf-viewer/shared/protocol.test.ts: isWebviewMessage
      accepts every documented variant with its required fields and
      rejects payloads missing them; isSafeExternalUrl accepts http,
      https, mailto and rejects file, command, vscode, javascript,
      data"
    - "__tests__/pdf-viewer/shared/readingState.test.ts:
      normalizeReadingState accepts a well-formed state, coerces
      page to an integer, clamps sidebar.width into
      [MIN_SIDEBAR_WIDTH, MAX_SIDEBAR_WIDTH], drops states with
      invalid scaleValue, returns undefined for non-object inputs;
      clampPage clamps into [1, totalPages]"
    - "__tests__/pdf-viewer/PdfRenderer.test.ts: generateHtml embeds
      the reader-bundle modulepreload with the correct nonce, the
      pdfjs modulepreload, the boot JSON block with `<` replaced by
      its Unicode escape (backslash-u003c), the unchanged CSP, and
      returns the 'Reader bundle not built' page when
      dist/reader/reader.js is absent"
    - "__tests__/pdf-viewer/webview/logic/keymap.test.ts: covers
      resolveKey for the full conventional and vim tables, the gg
      chord within CHORD_TIMEOUT_MS (800 ms), the inTextInput rule
      (only modified chords, function keys and Escape resolve),
      Alt+letter matching on KeyboardEvent.code, and
      cheatsheetRows"
    - "__tests__/pdf-viewer/webview/logic/zoomMath.test.ts: covers
      MIN_SCALE / MAX_SCALE clamping, ZOOM_STEPS ladder,
      nextZoomStep at both ends, wheelToScaleFactor for pixel and
      line deltas, boundedFactor, anchorOrigin, isPresetScale,
      formatZoomLabel"
    - "__tests__/pdf-viewer/webview/logic/historyStack.test.ts:
      HistoryStack.visit truncates the forward branch, deduplicates
      near-duplicate positions on the same page, caps at
      HISTORY_CAP (50); back/forward return null when past an end"
    - "__tests__/pdf-viewer/webview/logic/autohide.test.ts:
      toolbarVisibility hides after > HIDE_AFTER_DOWN_PX (24) of
      cumulative downward scroll, shows on upward scroll >=
      SHOW_AFTER_UP_PX (8), pointer within POINTER_REVEAL_PX (48),
      focusWithin, findOpen, menuOpen, or scrollTop <
      TOP_REVEAL_PX (8)"
    - "__tests__/pdf-viewer/webview/logic/debounce.test.ts:
      createDebouncer coalesces calls, fires the trailing call after
      the delay with the latest args, flush runs the pending call
      synchronously, cancel drops it (fake timers)"
    - "__tests__/pdf-viewer/webview/logic/outlineModel.test.ts:
      flattenOutline walks depth-first with stable ids;
      visibleRows respects the collapsed set;
      activeOutlineIndex picks the deepest entry whose page <=
      current page"
    - "__tests__/pdf-viewer/webview/logic/destGeometry.test.ts:
      destPoint parses XYZ / FitH / FitBH / FitV / FitBV / FitR /
      Fit / FitB; cropRectForPreview clamps within the page and
      keeps leadRatio of context above the anchor"
    - "__tests__/pdf-viewer/webview/logic/textLines.test.ts:
      detectColumns finds a gutter in a two-column layout and
      returns null for a one-column page; groupItemsIntoLines
      preserves reading order per column"
    - "__tests__/pdf-viewer/webview/logic/referenceList.test.ts:
