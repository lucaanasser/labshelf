feature:
  name: PDF Reader Navigation and Layout
  module: pdf-viewer
  description: >
    Immersive, Zotero-class navigation for the LabShelf PDF reader.
    Covers the overlay toolbar with auto-hide, the single left sidebar
    with three tabs (Thumbnails, Outline, Annotations), the always-
    visible bottom-right status pill, the theme popover, in-page find,
    the custom history stack, cursor-anchored zoom, keyboard bindings
    (conventional plus opt-in vim), reading-state persistence, and the
    settings and contributed keybindings that back it. The bundled
    runtime that hosts all of this is described in
    pdf-viewer/reader-webview.spec.yaml.

structure:
  description: >
    UI code lives under packages/vscode/src/pdf-viewer/webview/ui/*.
    Every non-trivial decision moves into a pure module under
    packages/vscode/src/pdf-viewer/webview/logic/* so it is jest-tested
    without jsdom. Host-side settings live in
    packages/vscode/src/pdf-viewer/readerPrefs.ts and are pushed to the
    webview via the init and prefsChanged messages defined in
    shared/protocol.ts.
  layout:
    webview/ui/toolbar.ts: >
      Overlay toolbar (position:absolute, transform:translateY(-100%)
      when hidden). Left group: sidebar toggle, back, forward. Centre:
      paper title. Right group: find, theme, help. Buttons are inline
      SVGs with stroke=currentColor via ui/icons.ts. Reveals the bar
      briefly after keyboard-driven jumps.
    webview/ui/statusPill.ts: >
      Always visible in the bottom-right; dimmed via CSS until hover or
      focus. Shows an editable page input and a zoom label with +/-
      buttons. Clicking the zoom label opens the fit menu built with
      buildMenu (Fit width, Fit page, Actual size, Automatic, and the
      fixed percentages [50, 75, 100, 125, 150, 200, 300, 400]).
    webview/ui/sidebar.ts: >
      One left sidebar with three tabs (Thumbnails, Outline,
      Annotations). Width clamped to [MIN_SIDEBAR_WIDTH,
      MAX_SIDEBAR_WIDTH] and persisted through the reading state.
      Sidebar starts on the Outline tab by default. Selecting the
      active tab is a no-op; selecting a different tab opens the
      sidebar if closed.
    webview/ui/thumbnailsTab.ts: >
      Thumbnail grid with IntersectionObserver-driven lazy render.
    webview/ui/outlineTab.ts: >
      Collapsible outline tree with active-item tracking. Deep
      outlines (>40 rows) auto-collapse past depth 1. Clicking an
      item goes through linkService.goToDestination so the jump is
      recorded in the history.
    webview/ui/annotationsTab.ts: >
      Reuses the current annotations list (grouped by page, delete
      button, click-to-jump). Also carries the Copy/Export buttons
      documented in pdf-reader-paper-resources.spec.yaml.
    webview/ui/findBar.ts: >
      In-page find bar driving PDFFindController via
      eventBus.dispatch("find", …).
    webview/ui/zoomController.ts: >
      Wheel/pinch zoom controller, ladder steps, fit modes and refit
      on resize.
    webview/ui/navHistory.ts: >
      HistoryStack adapter installed with PDFLinkService.setHistory.
    webview/ui/keyboard.ts: >
      Wires keymap.ts to keydown events, drives the held-key scroll
      loop, and calls Keyboard.dispatch(action, 'key' | 'host') which
      uses logic/actionDedupe.isDuplicateDelivery to drop only the
      same action arriving through the OTHER source within
      CROSS_SOURCE_WINDOW_MS (250 ms). Same-source repeats (held
      keys, repeated palette commands) always run.
    webview/ui/focusGuard.ts: >
      installTextLayerFocusGuard wraps HTMLElement.prototype.focus so
      that any element with class `textLayer` is focused with
      preventScroll: true. Reason: PDFLinkService focuses the
      destination page's text layer once it renders after a link is
      followed; if the reader has already pressed Back by then, that
      late focus would drag them back to the destination, and it can
      nudge the precise XYZ position even when they stayed. Installed
      as the very first thing in main.ts.
    webview/ui/cheatsheet.ts: >
      Modal listing every binding (from cheatsheetRows), shown by "?".
    webview/ui/readingStateReporter.ts: >
      updateviewarea listener with a SAVE_DEBOUNCE_MS (800 ms) trailing
      debouncer; flushed on visibilitychange (document.hidden) and
      pagehide. Only starts reporting after restore, so the initial
      page-1 layout never overwrites the stored position.
    webview/ui/theme.ts: >
      Applies data-pdf-theme on <html> and pageColors on pdf.js via
      viewer.pageColors + viewer._pages[i].pageColors. Uses
      shared/themePresets.ts.
    webview/ui/themePopover.ts: >
      Theme picker with the five presets and a Custom section (two
      colour pickers). Custom picks call theme.applyPageColors and are
      session-only; picking a preset posts { command: "selectTheme" }
      and lets the host persist the choice.
    webview/logic/autohide.ts: >
      toolbarVisibility reducer. AutohideInputs carries an optional
      `engaged` flag; while it is false the toolbar is pinned visible
      regardless of scroll. Toolbar.ts flips engaged to true on the
      first wheel / touchmove / pointerdown on #viewerContainer or
      any keydown. Reason: pdf.js scrolls programmatically while
      opening and restoring a paper, which used to hide the toolbar
      before the reader ever saw it.
    webview/logic/actionDedupe.ts: >
      Cross-source dedupe for reader actions. ActionSource is 'key' |
      'host'; isDuplicateDelivery(last, next) is true only when
      last.action === next.action, sources differ, and the gap is
      within CROSS_SOURCE_WINDOW_MS (250 ms). Same-source repeats
      run every time.
    webview/logic/findScroll.ts: >
      Pure decision helpers for the ReaderFindController override.
      FIND_OVERLAY_PX = 110 (toolbar + find bar + breathing room);
      FIND_ORIGIN_TTL_MS = 3000. freshOrigin invalidates an origin
      older than the TTL; decideMatchScroll returns 'stay' when the
      hit already sits at least 110 px below the top and 64 px above
      the bottom, otherwise 'place' at max(110, 30% of the container
      height).
    webview/logic/zoomMath.ts: >
      MIN_SCALE (0.25), MAX_SCALE (8), ZOOM_STEPS ladder,
      wheelToScaleFactor (pixel vs. line delta modes), anchorOrigin,
      isPresetScale, formatZoomLabel, nextZoomStep, boundedFactor.
    webview/logic/historyStack.ts: >
      HistoryStack class (visit, back, forward, canGoBack,
      canGoForward, clear). HISTORY_CAP = 50; two positions within
      NEAR_POINTS (120 PDF points) on the same page count as the
      same place and dedupe.
    webview/logic/keymap.ts: >
      Pure keyboard resolver. Full conventional table and vim layer
      (see keyboard section below). CHORD_TIMEOUT_MS = 800 ms.
      Alt+letter chords match on KeyboardEvent.code because macOS
      rewrites `key` for Option+letter. Inside a text input only
      modified chords, function keys and Escape resolve.
    webview/logic/debounce.ts: >
      Trailing debouncer with an explicit flush() and cancel().
    webview/logic/outlineModel.ts: >
      flattenOutline, visibleRows, activeOutlineIndex; caps depth
      at 12 and rows at 5000 for pathological outlines.
    packages/vscode/src/pdf-viewer/readerPrefs.ts: >
      Host-side loader for labshelf.reader.* configuration. Every
      value is validated and falls back to DEFAULT_READER_PREFS;
      hoverDelayMs is clamped to [0, 2000]. openBeside is NOT part of
      ReaderPrefs.

architecture:
  inputs:
    - init message from the host (ReadingState + ReaderPrefs +
      annotations + theme + effectiveTheme)
    - prefsChanged messages triggered by
      vscode.workspace.onDidChangeConfiguration
    - >-
      pdf.js events: pagesinit, pagerendered, pagechanging,
      updateviewarea, scalechanging, updatefindmatchescount,
      updatefindcontrolstate
    - wheel, keydown, pointer events on the webview
    - clicks on toolbar controls, sidebar tabs, pill, thumbnails,
      outline items, annotation rows, in-document links, find bar
      controls
  outputs:
    - WebviewToHost.saveReadingState (debounced 800 ms; flushed on
      hide/unload)
    - WebviewToHost.pageChanged for host bookkeeping (dwell timer)
    - WebviewToHost.selectTheme when the theme popover picks a preset
    - PDFViewer scroll and scale mutations
    - reading_events (open, close, scroll dwell, annotate)
      forwarded via PdfViewerPanel to
      AiService.recordReadingEvent
  dependencies:
    - pdf.js PDFViewer, PDFFindController, PDFLinkService (loaded at
      runtime; types only at build time)
    - shared/protocol, shared/readingState, shared/themePresets
    - webview/logic/* (pure)
    - vscode Configuration API (host side only)

layout:
  chrome:
    overlay_toolbar:
      placement: position absolute at the top of #pdf-shell
      hide_transform: transform translateY(-100%) via CSS class
        rd-toolbar-hidden
      reason_absolute: >
        The toolbar does not participate in the viewer layout, so
        showing or hiding it never triggers a viewer resize or a
        re-raster.
      layout_of_controls:
        left_group: [sidebar toggle, back, forward]
        centre: paper title (title attribute reproduces the full text)
        right_group: [find, theme, help]
    left_sidebar:
      placement: >-
        left rail inside #app, above the viewer stacking
        context
      tabs: [thumbnails, outline, annotations]
      width_range_px: [MIN_SIDEBAR_WIDTH, MAX_SIDEBAR_WIDTH]
      width_persisted: true (through the reading state)
      resize_handle: >-
        a #sidebar-resizer element next to the sidebar,
        drag with pointer capture; documentElement carries the
        rd-resizing class during the drag
      shortcut: F4
    status_pill:
      placement: bottom right of #pdf-shell, fixed within the panel
      shape: rounded pill (CSS)
      content_format: "<pageInput> / <total>  −  −  <zoom%>  +"
      page_input: focus selects the value, Enter commits (goToPage
        after clamping), Escape cancels and re-syncs to the current
        page
      zoom_click: opens the fit menu
      always_visible: yes
      opacity_rules:
        default: 0.55 (styles/reader.css `#status-pill`)
        chrome_hidden: 0.3 (with the root class `rd-chrome-hidden`,
          set by the toolbar when it hides)
        hover_or_focus: 1 (hover or focus-within, regardless of
          rd-chrome-hidden)
    theme_popover:
      trigger: theme button in the toolbar
      contents:
        - Five preset buttons (Auto, Light, Dark, Sepia,
          High contrast) with role="radio" and coloured swatches
        - >-
          Custom section: two <input type="color"> pickers (Page,
          Text) that call theme.applyPageColors directly on change;
          the picks are session-only (not persisted)
      reason_moved_here: >
        The previous inline color pickers next to the theme dropdown
        moved into the popover when the toolbar became overlay/
        immersive.
  icons:
    source: webview/ui/icons.ts
    style: inline SVGs, Feather-style, stroke=currentColor
    rule: no Unicode entity icons anywhere in the reader

toolbar_autohide:
  setting: labshelf.reader.toolbarAutoHide (default true; when false
    the toolbar is pinned)
  logic_module: webview/logic/autohide.ts
  hide_after_down_px: HIDE_AFTER_DOWN_PX = 24
  show_after_up_px: SHOW_AFTER_UP_PX = 8
  pointer_reveal_px: POINTER_REVEAL_PX = 48
  top_reveal_px: TOP_REVEAL_PX = 8
  engagement_gate: >
    AutohideInputs carries an optional `engaged` flag. It starts
    false and flips to true on the first genuine user input on
    #viewerContainer (wheel, touchmove, pointerdown) or any keydown
    on document. While engaged is false the toolbar is pinned
    visible; this is what keeps the bar in view through pdf.js'
    programmatic scrolls at open and restore (which would otherwise
    hide it before the reader saw it).
  open_state: >
    Toolbar visible on open regardless of whether a stored reading
    position was applied. It only starts hiding after the first
    manual scroll down.
  pinned_when: >
    !enabled || engaged === false || focusWithin || findOpen ||
    menuOpen || scrollTop < TOP_REVEAL_PX ||
    (pointerY !== null && pointerY < POINTER_REVEAL_PX). While
    pinned, travel is reset to 0 so the next scroll starts fresh.

find:
  controller: >
    A ReaderFindController subclass of pdf.js' PDFFindController is
    defined inside createViewer (webview/ui/viewerSetup.ts) and
    passed to PDFViewer as findController. It overrides the public
    scrollMatchIntoView; no private pdf.js API is used.
  panel_setting: enableFindWidget deliberately unset on the WebviewPanel
  highlight_all: always true (no toggle exposed)
  toggles:
    - matchCase (Aa button, aria-pressed)
    - entireWord (W button, aria-pressed)
  matchDiacritics: false
  commands:
    open: Ctrl/Cmd+F
    next: Enter, F3, Ctrl/Cmd+G
    previous: Shift+Enter, Shift+F3, Ctrl/Cmd+Shift+G
    close: Esc (dispatches findbarclose and clears state; focus
      returns to #viewerContainer)
  events_consumed:
    - updatefindmatchescount → "N of M" counter
    - updatefindcontrolstate → not-found (with query text), wrapped,
      pending
  hit_placement:
    reason: >
      pdf.js handles a find step in two scrolls — first the hit's
      page is aligned with the container top via linkService.page,
      then (once the page's text layer exists) the hit itself is
      parked 50 px below the container top, i.e. underneath the
      reader's overlay toolbar and find bar. pdf.js does both even
      when the hit was already on screen.
    origin_snapshot: >
      ctx.markFindOrigin() records { scrollTop, scrollLeft, at:
      performance.now() } and FindBar.dispatch() calls it right
      before every `find` event dispatch. An origin older than
      FIND_ORIGIN_TTL_MS = 3000 ms is discarded (a late text-layer
      render must not yank the reader back).
    decision: >
      After pdf.js' scrollMatchIntoView runs, ReaderFindController
      compares the hit rect with the origin. If the hit already sat
      inside the reading zone (at least FIND_OVERLAY_PX = 110 px
      below the top AND 64 px above the bottom of the container),
      decideMatchScroll returns "stay" and the container's original
      scrollTop / scrollLeft are restored so the page does not
      move. Otherwise it returns "place" and the hit is put at
      max(110 px, 30% of container.clientHeight) from the top —
      never under the find bar.
  history_push: >
    A find "again" dispatch records the departure point after a
    FAR_JUMP_SETTLE_MS (300 ms) settle; when the current page moved
    more than 2 pages, history.visit(before) is called so Back
    returns to the pre-find position.

outline:
  source: pdfDocument.getOutline()
  data_flow: >
    outlineModel.flattenOutline(rawOutline) → OutlineRow[];
    outlineModel.visibleRows(rows, collapsed) is re-derived on every
    render; activeOutlineIndex(pageMap, currentPage) tracks the
    active entry.
  interaction:
    - click → linkService.goToDestination(dest); also pushes history
      via pdf.js (setHistory adapter)
    - Enter on a focused item behaves the same as click
    - twisty click toggles collapsed state; parents auto-expand as
      needed
  active_tracking: >
    Destinations resolve to page numbers lazily
    (pdfDocument.getDestination + getPageIndex); once resolved, the
    active row is the deepest whose page <= currentPage. Under a
    collapsed parent the nearest visible ancestor stands in.

thumbnails:
  thumb_css_width_px: 132
  dpr_cap: 2
  root_margin: "300px 0px"
  concurrency: MAX_CONCURRENT = 2
  render_strategy: >
    Each thumbnail starts as a placeholder <div>. An
    IntersectionObserver flips it to "queued" when visible and a
    concurrency-2 pump calls page.render at scale
    (THUMB_CSS_WIDTH / basePageWidth) * dpr with the current
    pageColors.
  cancellation: >
    RenderTask is cancelled when the placeholder leaves the viewport
    or when the tab hides.
  teardown: >
    When the tab has been hidden for TEARDOWN_AFTER_HIDDEN_MS
    (60 000 ms), all thumbnail canvases are detached and placeholders
    are re-observed by the IntersectionObserver so they re-render
    lazily.
  click_behaviour: goToPage(n); pushes history via
    history.recordDeparture().

navigation_history:
  module: webview/logic/historyStack.ts + webview/ui/navHistory.ts
  installed_via: linkService.setHistory(adapter)
  adapter_shape:
    - pushCurrentPosition() → recordDeparture (visit current location)
    - push() → no-op (target is implicit; the stack is a departure stack)
    - pushPage() → no-op
    - back() → navHistory.back()
    - forward() → navHistory.forward()
  push_rules:
    - visit() truncates the forward stack
    - near-duplicate entries within NEAR_POINTS (120 PDF points) on
      the same page are dropped
    - cap HISTORY_CAP = 50 entries; oldest evicted
  current_location_freshness: >
    NavHistory.current() calls the public pdfViewer.update() before
    reading the cached updateviewarea location. pdf.js refreshes
    that location one animation frame after a scroll; without the
    forced update, two jumps within the same frame (chord repeat,
    programmatic chain) would record the first jump's departure
    point twice and lose the second.
  push_sources:
    - internal link clicks (link annotations, via pdf.js)
    - outline item clicks (via linkService.goToDestination)
    - go-to-page from the status pill (recordDeparture before the jump)
    - thumbnails (recordDeparture before the jump)
    - annotation row jumps (recordDeparture before goToPage)
    - find "again" jumps that move more than 2 pages (visit(before))
  ui:
    - back/forward buttons in the toolbar; enabled/disabled follow
      canGoBack/canGoForward
    - Alt+Left / Alt+Right (Cmd+[ / Cmd+] on macOS) contributed
      keybindings scoped to the panel

zoom:
  wheel_and_pinch:
    listener: wheel on #viewerContainer with { passive: false }
    trigger: ctrlKey || metaKey (trackpad pinch arrives as ctrl+wheel)
    delta_accumulation: >
      Wheel deltas multiply into pendingFactor per event; one
      requestAnimationFrame coalesces the frame's factor into a
      single pdfViewer.updateScale call.
    drawing_delay_ms: WHEEL_DRAWING_DELAY_MS = 400
    origin_correction: >
      pdf.js updateScale({origin}) subtracts
      [container.offsetLeft, container.offsetTop] which are relative
      to the offsetParent, not the viewport. anchorOrigin rebases
      the pointer into that space so the anchor stays correct with
      the sidebar open.
  buttons_and_keys:
    ladder: ZOOM_STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.9, 1, 1.1,
      1.25, 1.5, 1.75, 2, 2.5, 3, 4, 5, 6, 8]
    step_drawing_delay_ms: STEP_DRAWING_DELAY_MS = 150
    step_origin: viewport centre (kept fixed for button/key steps)
  fit_modes:
    - page-width
    - page-fit
    - page-actual
    - auto
  refit_on_resize:
    listener: >-
      ResizeObserver on #viewerContainer with a
      REFIT_DEBOUNCE_MS = 120 debounce
    only_for_presets: true (isPresetScale); a numeric zoom is never
      refit
    reason: >
      PDFViewer does not refit itself on resize. Reapplying
      currentScaleValue for preset values keeps fit-width and
      fit-page correct when the panel is resized.
  clamp_scale: [MIN_SCALE = 0.25, MAX_SCALE = 8]
  linkservice_zoom: >
    PDFLinkService is constructed with ignoreDestinationZoom: true, so
    following a link never overrides the reader's chosen zoom (a
    stored "XYZ ... 0.8" destination would otherwise shrink the page).

keyboard:
  ignore_when_focus_is_input: >
    Inside <input>, <textarea> or [contenteditable] only modified
    chords (mod/alt/shift), function keys (Fn) and Escape resolve.
    Bare j / gg / etc. never fire while a text input has focus.
  blocked_while_typing: >
    ACTIONS_BLOCKED_WHILE_TYPING (historyBack, historyForward) never
    run while a text field has focus: Alt/Option+Left/Right moves the
    caret by word there. resolveKey drops them on the keydown path and
    Keyboard.dispatch drops them on the host path, because the
    contributed alt+left / alt+right keybindings fire regardless of
    where the focus is inside the webview.
  activate_controls: >
    When a keydown targets a focused control (button, link, [role=button],
    [role=treeitem]), Space and Enter are left alone (the control
    activates natively).
  native_scroll_in_chrome: >
    When the target is inside #sidebar or a popover (.rd-popover),
    scroll actions (arrows, PgUp/PgDn, Space, Home/End, next/prev
    page) fall through to native scrolling of that list.
  cheatsheet: pressing "?" opens the cheatsheet modal
    (cheatsheetRows), which lists every binding for the active
    layer.
  conventional_layer:
    - "ArrowDown: scroll down (held-key loop)"
    - "ArrowUp: scroll up (held-key loop)"
    - "ArrowRight: next page"
    - "ArrowLeft: previous page"
    - "PageDown: page down (one screen)"
    - "Space: page down"
    - "PageUp: page up"
    - "Shift+Space: page up"
    - "Home: first page"
    - "End: last page"
    - "Ctrl/Cmd+Alt+G: go to page (focus the pill input)"
    - "Alt+Left: history back"
    - "Alt+Right: history forward"
    - "Cmd+[ (macOS only): history back"
    - "Cmd+] (macOS only): history forward"
    - "Ctrl/Cmd+F: open find bar"
    - "Ctrl/Cmd+G: next match"
    - "Ctrl/Cmd+Shift+G: previous match"
    - "F3: next match"
    - "Shift+F3: previous match"
    - "Ctrl/Cmd+=: zoom in"
    - "Ctrl/Cmd++: zoom in"
    - "Ctrl/Cmd+-: zoom out"
    - "Ctrl/Cmd+0: reset zoom to defaultZoom (setting)"
    - "F4: toggle sidebar"
    - "Ctrl/Cmd+Shift+C: copy selection with citation"
    - "?: open cheatsheet"
    - "Escape: close the top-most transient (cheatsheet, popover,
      find bar, then selection bubble or hover popup)"
  no_ctrl_or_cmd_b_binding: >
    Ctrl/Cmd+B is deliberately not used. VS Code itself binds that
    chord to toggling its primary sidebar, and letting both fire
    would leave the reader out of sync with the surrounding editor.
    Sidebar toggle uses F4 instead.
  vim_layer:
    setting: labshelf.reader.vimKeys (default false)
    single_key_chord: >
      In vim mode, when the reader is focused and no chord is
      pending, unmodified single-key bindings resolve first; the
      conventional table still applies to modified chords.
    bindings:
      - "j: scroll down"
      - "k: scroll up"
      - "h: scroll left"
      - "l: scroll right"
      - "d: half-page down"
      - "u: half-page up"
      - "J: next page"
      - "K: previous page"
      - "gg (chord, second g within 800 ms): first page"
      - "G: last page"
      - "H: history back"
      - "L: history forward"
      - "/: open find bar"
      - "n: next match"
      - "N: previous match"
      - "+: zoom in"
      - "=: zoom in"
      - "-: zoom out"
      - "w: fit width"
      - "e: fit page"
      - ":: go to page (focus the pill input)"
      - "t: toggle sidebar"
  chord_state: >
    keymap.ts tracks a pending prefix (the first g of gg). Any other
    key clears it; the second g must arrive within CHORD_TIMEOUT_MS
    (800 ms). Keyboard.ts wires this into a timeout in ui/keyboard.ts.
  held_key_scroll: >
    ArrowDown / ArrowUp / ArrowLeft / ArrowRight run a
    requestAnimationFrame velocity loop at SCROLL_PX_PER_SEC
    (900 px/s). A single tap still scrolls a useful 40 px so short
    presses feel responsive. The loop stops on keyup or window blur.

reading_state_persistence:
  sidecar_field: reading (see storage/storage.spec.yaml)
  payload_shape: >
    { page: number, scaleValue: string, left?: number, top?: number,
      sidebar?: { open: boolean, tab: SidebarTab, width?: number },
      updatedAt: string (ISO) }
  scale_value_choice: >
    While the viewer is on a preset (page-width, page-fit, page-actual,
    auto), scaleValue stores the preset string so a window resize
    keeps refitting correctly. When the user picks a numeric zoom,
    scaleValue stores String(currentScale) so the exact zoom is
    restored.
  debounce_ms: 800 (SAVE_DEBOUNCE_MS)
  flush_on:
    - visibilitychange when document.hidden becomes true
    - pagehide
  start_after_restore: >
    ReadingStateReporter.start() runs at the end of the pagesinit
    restore path so the initial page-1 layout never overwrites the
    stored position.
  write_queue: >
    Serialization of writes for a given paperId lives in
    PaperDataStore (per-paper Promise chain). See
    storage/storage.spec.yaml.
  restore:
    when: on pagesinit, and only when the init payload carries a
      `reading` state AND labshelf.reader.restorePosition is true
    how: >
      pdfViewer.currentScaleValue = state.scaleValue;
      pdfViewer.scrollPageIntoView({
        pageNumber: clampPage(state.page, totalPages),
        destArray: [null, {name:"XYZ"}, state.left ?? null,
          state.top, null], allowNegativeOffset: true
      })
      when state.top is defined; otherwise just pageNumber. Sidebar
      restore calls sidebar.restore(state.sidebar) and updates the
      toolbar toggle.
    fallback: clampPage clamps out-of-range pages into [1,
      totalPages] before restore.
    late_init: >
      If the host's `init` arrives only after the reader has already
      moved (first wheel / touchmove / pointerdown on the container or
      any keydown), the stored position is NOT applied: restoring then
      would yank the page from under them. Theme, annotations and
      preferences from that `init` are still applied.
  setting: labshelf.reader.restorePosition (default true)
  reading_events_wiring:
    open: emitted by PdfViewerPanel on the reader's "ready" reply
    close: emitted by PdfViewerPanel on dispose (guarded to run once)
      with the last known page and durationMs since open
    scroll_dwell:
      threshold_ms: 5000 (MIN_DWELL_MS)
      only_when_visible: yes — the dwell timer resets when the panel
        becomes invisible and restarts on visible
      trigger: every pageChanged that moves to a new page records the
        dwell of the page just left
    annotate: emitted on createAnnotation with the target page number

settings:
  section: labshelf.reader.*
  properties:
    labshelf.reader.vimKeys:
      type: boolean
      default: false
      description: Enable single-key vim navigation.
    labshelf.reader.defaultZoom:
      type: string
      enum: [page-width, page-fit, page-actual, auto]
      default: page-width
      description: Zoom applied when a paper opens without a stored
        reading position, and by Reset Zoom.
    labshelf.reader.toolbarAutoHide:
      type: boolean
      default: true
      description: Hide the reader toolbar while scrolling down.
    labshelf.reader.restorePosition:
      type: boolean
      default: true
      description: Reopen each paper at the last page, zoom and
        sidebar state.
    labshelf.reader.hoverPreviews:
      type: boolean
      default: true
      description: Show hover previews for internal PDF links.
    labshelf.reader.hoverDelayMs:
      type: number
      default: 250
      minimum: 0
      maximum: 2000
      description: Delay before a hover preview opens.
    labshelf.reader.citationStyle:
      type: string
      enum: [pandoc, latex, author-year, citekey]
      default: pandoc
      description: Output style of Copy with Citation.
    labshelf.reader.openBeside:
      type: boolean
      default: true
      description: Open the reader beside the current editor
        (ViewColumn.Two) instead of the active group.
  host_loader: >
    packages/vscode/src/pdf-viewer/readerPrefs.ts. getReaderPrefs()
    reads every setting, validates it, and returns a ReaderPrefs;
    hoverDelayMs is clamped to [0, 2000]. openBeside is not part of
    ReaderPrefs and is read separately by getReaderViewColumn().
    PdfViewerPanel listens to onDidChangeConfiguration for the
    READER_CONFIG_SECTION and posts prefsChanged to the panel it
    owns.

contributed_keybindings:
  scope: >
    All reader keybindings are contributed unconditionally in
    package.json with `when: activeWebviewPanelId == 'labshelfPdf'`,
    and each maps to a labshelf.reader.<id> command whose handler is
    PdfViewerPanel.postToActive(id). Cross-source dedupe lives in
    webview/logic/actionDedupe.ts: Keyboard.dispatch(action, source)
    where source is 'key' (own keydown) or 'host' (from a
    `command` message). isDuplicateDelivery drops a delivery only
    when it is the SAME action from the OTHER source within
    CROSS_SOURCE_WINDOW_MS (250 ms). Same-source repeats — held
    keys, repeated palette commands — always run.
  contributed_commands:
    - labshelf.reader.zoomIn — Ctrl+= (mac Cmd+=), also Ctrl+Shift+= (mac Cmd+Shift+=)
    - labshelf.reader.zoomOut — Ctrl+- (mac Cmd+-)
    - labshelf.reader.zoomReset — Ctrl+0 (mac Cmd+0)
    - labshelf.reader.find — Ctrl+F (mac Cmd+F)
    - labshelf.reader.historyBack — Alt+Left, plus a second binding
      that keeps Alt+Left on macOS but adds Cmd+[
    - labshelf.reader.historyForward — Alt+Right, plus a second
      binding with Cmd+]
    - labshelf.reader.toggleSidebar — F4
  palette_visibility: >
    All labshelf.reader.* commands are hidden from the command
    palette unless a reader panel is focused, via
    menus.commandPalette entries scoped by
    activeWebviewPanelId == 'labshelfPdf'.
  library_commands_that_open_the_reader:
    - labshelf.openPaperPdf (delegates to labshelf.openPdfViewer)
    - labshelf.openPaper (picks a paper, then labshelf.openPdfViewer)
    - labshelf.searchLibrary (picks a paper, then
      labshelf.openPdfViewer)
    - >-
      labshelf.openPdfViewer (paperId?: string, page?: number) —
      when paperId is missing, resolvePaper (exported from
      commands/registerCommands.ts) shows the quick pick
    - labshelf.openPaperPdfExternal — escape hatch that opens
      paper.pdf with vscode.open
    - labshelf.exportAnnotations — see
      pdf-reader-paper-resources.spec.yaml

database:
  tables_used:
    - reading_events (AI subsystem; appended when the reader emits
      open/close/scroll/annotate through
      AiService.recordReadingEvent)
  migrations: []

events:
  emits:
    - PDF_VIEWER_OPENED (host, when the panel is created)
    - PDF_VIEWER_CLOSED (host, on dispose; guarded once)
  listens:
    - vscode.workspace.onDidChangeConfiguration (host; posts
      prefsChanged for the READER_CONFIG_SECTION)
    - vscode.window.onDidChangeActiveColorTheme (host; posts
      applyTheme when the paper theme is auto)
    - >-
      pdf.js EventBus: pagesinit, pagerendered, pagechanging,
      updateviewarea, scalechanging, updatefindmatchescount,
      updatefindcontrolstate

errors:
  expected_failures:
    - PDFFindController raises during a search (invalid pattern or
      torn-down document)
    - outline retrieval returns null (PDF has no outline)
    - thumbnails cannot render a page (RenderTask cancelled or
      rejected)
    - reading state stored with an out-of-range page or unknown
      scaleValue
    - pdf.js private surface changes (pdfViewer._pages missing after
      upgrade)
    - keydown that would collide with a VS Code global (Ctrl+F,
      Ctrl+=, Ctrl+-, Ctrl+0)
  handling_strategy: >
    A find error stays inside the find bar (input flagged
    rd-find-notfound) and the bar remains usable. A missing outline
    renders an empty state row instead of a tree. Thumbnail render
    errors mark the thumb "idle" so it retries next time it enters
    the viewport; nothing is thrown. Reading state whose page is
    out of range is clamped by clampPage; an invalid scaleValue is
    dropped by normalizeReadingState before it reaches the
    reporter. A private-surface change stays inside webview/ui/theme.ts,
    which no-ops when pdfViewer._pages is not an array. Global-
    shortcut collisions are absorbed by the contributed keybindings
    (cross-source dedupe: same action from the other source dropped
    within CROSS_SOURCE_WINDOW_MS = 250 ms).

ui:
  view_type: webview_panel
  panel_id: labshelfPdf
  design_principle: >
    Immersive. The user reads first; chrome recedes. Every visible
    surface is either the paper, a status pill, or a control the
    user invoked. Consistent inline SVG icon set with the rest of
    the app.
  layout:
    header: none (toolbar is an overlay)
    body:
      - "#app is a horizontal flex layout"
      - "#sidebar (left) is a fixed-width column, hidden by default"
      - "#pdf-shell holds #toolbar, #find-bar, #viewerContainer and
        #status-pill"
    footer:
      - "#status-pill is a floating element in the bottom-right of
        #pdf-shell"
      - "#selection-toolbar is anchored to the current selection
        rectangle"
    theme_popover:
      - triggered from the toolbar (droplet icon)
      - five preset buttons with role="radio"
      - Custom section: two <input type="color"> pickers (Page, Text)
  find_bar_layout: >
    A slim bar under the toolbar with: input, "N of M" counter
    (aria-live polite), matchCase (Aa), entireWord (W), prev/next
    icon buttons, and a close button.
  keyboard: see the keyboard section above for the full binding tables.

tests:
  unit:
    - "__tests__/pdf-viewer/webview/logic/autohide.test.ts:
      toolbarVisibility hides after >24 px cumulative downward
      scroll, shows on >=8 px upward scroll, pointer within 48 px of
      top, focusWithin, findOpen, menuOpen, or scrollTop < 8"
    - "__tests__/pdf-viewer/webview/logic/zoomMath.test.ts:
      wheelToScaleFactor for pixel and line deltas, anchorOrigin
      keeps the anchor correct with an offset container, ZOOM_STEPS
      ladder at both ends, clampScale into [0.25, 8]"
    - "__tests__/pdf-viewer/webview/logic/historyStack.test.ts:
      visit truncates forward, deduplicates near-duplicates within
      120 PDF points on the same page, caps at 50; back/forward
      return null past an end"
    - "__tests__/pdf-viewer/webview/logic/keymap.test.ts: resolves
      every conventional and vim binding; the gg chord fires only
      when both g arrive within 800 ms; inTextInput blocks bare
      keys but lets modified chords, function keys and Escape
      through; Alt+letter chords match on KeyboardEvent.code"
    - "__tests__/pdf-viewer/webview/logic/debounce.test.ts:
      createDebouncer fires the trailing call, flush runs it
      synchronously, cancel drops it (fake timers)"
    - "__tests__/pdf-viewer/webview/logic/outlineModel.test.ts:
      flattenOutline is depth-first with stable ids; visibleRows
      respects the collapsed set; activeOutlineIndex picks the
      deepest entry whose page <= current page"
    - "__tests__/pdf-viewer/webview/logic/destGeometry.test.ts:
      destPoint parses XYZ, FitH/FitBH, FitV/FitBV, FitR, Fit/FitB;
      cropRectForPreview clamps inside the page"
    - "__tests__/pdf-viewer/webview/logic/textLines.test.ts:
      detectColumns finds a gutter in two-column fixtures and
      returns null for one column; groupItemsIntoLines preserves
      reading order per column"
    - "__tests__/pdf-viewer/webview/logic/referenceList.test.ts:
      findReferencesStart matches every documented heading;
      splitReferenceEntries recovers hanging-indent, [n]-marker
      and two-column entries; entryAtY / entryByNumber return the
      correct entries (fixtures at __tests__/fixtures/references/)"
    - "__tests__/pdf-viewer/webview/logic/citationMarkers.test.ts:
      findCitationMarkers detects [12], [3, 7], [4-6] and the
      en-dash variant, expands ranges under MAX_RANGE (50), ignores
      12.15 / 12abc / bare 12; markerAtOffset picks the marker
      covering an offset"
    - "__tests__/pdf-viewer/webview/logic/findScroll.test.ts:
      freshOrigin invalidates an origin older than
      FIND_ORIGIN_TTL_MS (3000 ms); decideMatchScroll returns
      'stay' when the hit already sat inside the reading zone
      (>= FIND_OVERLAY_PX = 110 px from the top and 64 px from the
      bottom), otherwise 'place' at max(110 px, 30% of the
      container height)"
    - "__tests__/pdf-viewer/webview/logic/actionDedupe.test.ts:
      isDuplicateDelivery drops the same action arriving through
      the OTHER source within CROSS_SOURCE_WINDOW_MS (250 ms), and
      never drops a repeat from the SAME source (held key,
      repeated palette command)"
    - "__tests__/pdf-viewer/shared/readingState.test.ts:
      normalizeReadingState coerces page to int, clamps sidebar.width
      into [MIN_SIDEBAR_WIDTH, MAX_SIDEBAR_WIDTH], drops invalid
      scaleValue; clampPage clamps into [1, totalPages]"
  integration:
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts (existing):
      panel replies to ready-for-init with a well-formed init,
      forwards prefsChanged on onDidChangeConfiguration for
      READER_CONFIG_SECTION, saveReadingState is written through
      the write queue, guards double-dispose"
    - "__tests__/commands/registerCommands.test.ts (existing):
      resolvePaper handles the id-then-picker fallback, and
      labshelf.openPaper / labshelf.searchLibrary route through
      labshelf.openPdfViewer"
  manual:
    - "Open a paper: toolbar visible, page one starts below it; it
      hides only after the first manual scroll down."
    - Scroll down more than 24 px; the toolbar hides. Scroll up 8 px;
      it shows. Move the pointer to the top 48 px; it shows. Focus a
      toolbar button with Tab; it shows.
    - Toggle labshelf.reader.toolbarAutoHide off. The toolbar stays
      pinned regardless of scroll.
    - Open Thumbnails. Only the visible thumbnails render. Scroll
      fast; renders that scrolled out of view are cancelled. Switch
      tabs; hidden thumbnails tear down after 60 s.
    - Open Outline. Click a heading; the viewer jumps and history
      has an entry. Change pages; the active outline item follows.
    - Open a paper with an internal link. Click it. Alt+Left returns
      to the exact position; Alt+Right advances. Cmd+[ / Cmd+] do
      the same on macOS.
    - "Follow a citation link and press Back immediately: the view
      stays on the origin page (no late jump back to References
      when the destination page's text layer finally renders)."
    - "Find: the selected hit is never under the find bar; stepping
      to a hit already on screen does not move the page. Stepping
      to a hit off screen places it at max(110 px, 30% of the view
      height) from the top."
    - Ctrl/Cmd+wheel with the sidebar open — the zoom anchors at the
      cursor, not the viewer centre.
    - Ctrl+= / Ctrl+- / Ctrl+0 do not zoom the whole VS Code window.
    - Fit-width; resize the panel; the fit updates. Switch to 125 %;
      resize; the numeric scale stays.
    - >-
      Close and reopen: page, zoom, offsets and sidebar state all
      return (labshelf.reader.restorePosition on).
    - Toggle labshelf.reader.vimKeys. Press "j" and "gg"; behaviour
      matches the cheatsheet. Press "?" to open the cheatsheet.
    - F4 toggles the reader sidebar; Ctrl/Cmd+B still toggles VS
      Code's own sidebar without affecting the reader.
    - Read a page for 5 s. Look at reading_events; a scroll-dwell
      entry is recorded. Hiding the panel for a while does not count
      towards the dwell.

ai_notes:
  embeddings: false
  semantic_search: false
  reading_events_note: >
    reading_events feeds the AI subsystem's engagement signal. The
    reader is the only source of scroll-dwell and annotate events;
    open and close are emitted by PdfViewerPanel via the same
    callback. Background time is excluded from dwell via the
    onDidChangeViewState hooks.
  private_surface_isolation: >
    pdfViewer._pages usage stays inside webview/ui/theme.ts. If
    pdf.js changes the field name in a minor version, theme
    rebroadcast to already constructed PDFPageViews stops working
    but the reader keeps working — current-page and zoom paths use
    only public API.
