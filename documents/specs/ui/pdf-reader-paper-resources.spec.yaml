feature:
  name: PDF Reader Paper Resources
  module: pdf-viewer
  description: >
    Paper-aware features on top of the LabShelf reader: copying a
    quoted selection formatted with the paper's citation, exporting
    the paper's annotations as Markdown, showing hover previews for
    internal PDF links (citations that land in the References
    section, and jumps to figures, equations, tables and sections), a
    bounded fallback for bracketed numeric markers when a page has no
    link annotations, and safe handling of external links. This
    layer runs on top of the runtime described in
    pdf-viewer/reader-webview.spec.yaml and the layout described in
    ui/pdf-reader-navigation.spec.yaml.

structure:
  layout:
    packages/vscode/src/pdf-viewer/shared/citationFormat.ts: >
      Pure module. cleanQuote (de-hyphenates line breaks, collapses
      whitespace), authorYearLabel ("Silva et al., 2021" for 3+
      authors, "Silva & Costa, 2021" for two, "Silva, 2021" for one;
      falls back to the citekey when no author is known),
      formatQuoteWithCitation (four styles).
      CitablePaper = Pick<PaperRecord, "citeKey"|"title"|"authors"|"year">.
    packages/vscode/src/pdf-viewer/shared/annotationsMarkdown.ts: >
      Pure formatAnnotationsMarkdown(paper, annotations). Emits the
      layout documented under export_annotations.
    packages/vscode/src/pdf-viewer/webview/logic/citationMarkers.ts: >
      Bracketed marker detector for [n], [n, m], [n-m], [n-m, k] and
      the en-dash variant [n–m]. Returns { start, end, numbers[] }.
    packages/vscode/src/pdf-viewer/webview/logic/referenceList.ts: >
      Regex-driven References-heading matcher plus
      splitReferenceEntries (hanging-indent, numbered brackets),
      entryAtY, entryByNumber.
    packages/vscode/src/pdf-viewer/webview/logic/textLines.ts: >
      pdf.js TextItem geometry → column-aware lines
      (detectColumns, groupItemsIntoLines). readableItems runs first
      (called by ui/pageText.ts) and removes what is on the page but
      not in its running text: runs whose orientation
      (runOrientation of the pdf.js transform) differs from the
      page's dominant one — a publisher's "Downloaded … subject to
      license" stamp set sideways up the margin — and the 1–3
      character debris OCR makes of such a stamp, stranded more than
      two line-heights outside the text block (5th/95th percentile
      of word edges; needs ≥ 20 words). Marker-shaped tokens
      ("[1]", "3.", "a)") are never dropped. Without this every line
      starts with junk ("& REFERENCES", "5 [1] A. Author",
      "p FIG. 1.1. …") and no line-anchored rule downstream matches.
    packages/vscode/src/pdf-viewer/webview/logic/destGeometry.ts: >
      Shared with the navigation spec; destPoint parses XYZ /
      FitH/FitBH / FitV/FitBV / FitR / Fit/FitB and
      cropRectForPreview clamps the preview crop.
    packages/vscode/src/pdf-viewer/webview/ui/selectionBubble.ts: >
      Floating selection bubble with five colour swatches and a
      "Copy with Citation" button. Wires
      window.getSelection into a { text, pageNumber } derived from
      the .page ancestor of the selection start.
    packages/vscode/src/pdf-viewer/webview/ui/hoverPreview.ts: >
      Delegated mouseover on section.linkAnnotation[data-internal-link]
      inside #viewer, with a labshelf.reader.hoverDelayMs open delay
      and a CLOSE_GRACE_MS (150 ms) close grace period for the
      pointer moving from anchor to popup. Also runs a plain-text
      hit test for bracketed numeric markers on pages that have no
      link annotations.
    packages/vscode/src/pdf-viewer/webview/ui/destPreview.ts: >
      Renders the region around a link destination into a small
      cropped canvas for the popup. LRU of 4 full-page canvases,
      dpr capped at 2, PREVIEW_CSS_WIDTH = 420. Cache is cleared
      when the theme's pageColors change.
    packages/vscode/src/pdf-viewer/webview/ui/citationResolver.ts: >
      Locates the References section lazily. Scans the last
      SCAN_FRACTION (0.4) of pages (at least MIN_SCAN_PAGES = 4, at
      most MAX_SCAN_PAGES = 60 so a book never costs hundreds of
      pages of text extraction on the first hover), caches by page. Returns { text, number, ... } entries; when
      layout is ambiguous it returns null.
    packages/vscode/src/pdf-viewer/webview/ui/annotationsTab.ts: >
      Hosts the "Copy to clipboard" and "Export to file" buttons in
      the tab header.

architecture:
  inputs:
    - text selection ranges on the pdf.js text layer
    - the .page ancestor of the selection's start container
      (data-page-number) — the source of the pageNumber attached to
      a new highlight or copy-with-citation, NOT
      pdfViewer.currentPageNumber
    - link annotations on each page (page.getAnnotations, filtered
      by subtype === "Link"); cached per page
    - references section text (lazy, via citationResolver.locate)
    - the current PaperRecord (citeKey, title, authors, year)
    - labshelf.reader.hoverPreviews, hoverDelayMs, citationStyle
  outputs:
    - WebviewToHost.copyWithCitation { text, pageNumber }
    - WebviewToHost.exportAnnotations { target: clipboard | file }
    - WebviewToHost.copyText { text } (used by the popup Copy button)
    - WebviewToHost.openExternalLink { url } (for the http/https/
      mailto links pdf.js turns into <a> elements)
  dependencies:
    - PaperRecord.citeKey, authors, year, title (host side)
    - vscode.env.clipboard, vscode.window.showSaveDialog,
      vscode.env.openExternal
    - shared/citationFormat, shared/annotationsMarkdown,
      shared/protocol
    - webview/logic/{citationMarkers, referenceList, textLines,
      destGeometry}

copy_with_citation:
  triggers:
    - >-
      selection_bubble_button: the selection bubble in
      selectionBubble.ts shows a "Cite" button next to the five
      colour swatches (title "Copy with citation (Ctrl+Shift+C)" or
      "Copy with citation (Cmd+Shift+C)" on macOS)
    - >-
      keyboard: Ctrl+Shift+C on Windows/Linux, Cmd+Shift+C on macOS,
      dispatched through the keymap's copyWithCitation action
  attribution_page: >
    The pageNumber attached to the message is derived from the
    selection's .page ancestor
    (window.getSelection().getRangeAt(0).startContainer, walk to
    closest("#viewer .page"), read dataset.pageNumber). If the .page
    ancestor is missing (empty selection or non-page target), the
    bubble falls back to pdfViewer.currentPageNumber; the primary
    contract is "the page where the selection actually is".
  message: WebviewToHost.copyWithCitation { text, pageNumber }
  host_flow:
    - format the payload with
      shared/citationFormat.formatQuoteWithCitation(text, paper,
      pageNumber, getReaderPrefs().citationStyle)
    - write the result to vscode.env.clipboard.writeText
    - vscode.window.setStatusBarMessage("Copied with citation
      (@<citekey>, p. <n>)", 2500)
  styles:
    setting: labshelf.reader.citationStyle
    pandoc: |
      > <cleaned quote>

      [@<citekey>, p. <n>]
    latex: |
      ``<cleaned quote>'' \cite[p.~<n>]{<citekey>}
    author_year: |
      "<cleaned quote>" (<authorYearLabel>, p. <n>)
    citekey: |
      <cleaned quote> @<citekey>
  authorYearLabel_rule: >
    one author → "Surname"; two authors → "A & B"; three or more →
    "A et al."; year appended as ", <year>" when present; falls
    back to the citekey when the authors list is empty. See
    citationFormat.authorYearLabel.
  cleanQuote: >
    Line-ending "word-\n" hyphenation is repaired (word-continuation
    merges to "wordcontinuation"), all whitespace collapses to
    single spaces, and the result is trimmed.

export_annotations:
  triggers:
    - >-
      two icon buttons in the Annotations tab header
      (annotationsTab.ts): clipboard icon for "Copy annotations as
      Markdown" and download icon for "Export annotations to a
      Markdown file"
    - >-
      command palette: labshelf.exportAnnotations (paperId?: string)
      — extension.ts prompts a quick pick for the target
      (clipboard/file) and calls
      PdfViewerPanel.exportAnnotations. When paperId is omitted,
      resolvePaper (from commands/registerCommands.ts) shows the
      paper picker.
  destinations:
    - >-
      clipboard: PdfViewerPanel writes the Markdown to
      vscode.env.clipboard and shows a "Annotations copied as
      Markdown" status bar message (2500 ms)
    - >-
      file: vscode.window.showSaveDialog with defaultUri
      <paper.path>/annotations.md and filter Markdown: ["md"]; on
      confirm, writes the file with new TextEncoder().encode and
      opens it in a preview editor beside the reader
  markdown_shape:
    header: |
      # <paper.title>

      <authorYearLabel> · `@<citekey>`
    empty_state: >
      "_No annotations._" plus a trailing newline; nothing else.
    grouping: by pageNumber ascending, then by createdAt ascending
    section_per_page: |
      ## Page <n>
    entry_highlight: |
      > <cleanQuote(content)>

      <!-- highlight: <color> --> [@<citekey>, p. <n>]
    entry_other_types: >
      **<Type capitalized>:** <cleanQuote(content)>. Applies to
      note, comment, tag.
    trailing_newline: yes; every section ends with a blank line, and
      the document ends with a newline
  encoding: UTF-8, LF line endings, no BOM

hover_previews:
  setting: labshelf.reader.hoverPreviews (default true),
    labshelf.reader.hoverDelayMs (default 250, clamped [0, 2000])
  delegated_selector: >
    Mouseover is delegated at #viewer for
    section.linkAnnotation[data-internal-link]. Non-internal links
    never open a preview. The popup itself absorbs
    mouseenter/mouseleave to keep it alive while the user moves
    from anchor to popup.
  target_state:
    targets: >
      HoverPreview tracks two HoverTargets — `pending` (its delay is
      running, no popup yet) and `open` (a popup is visible). A
      target is { group, ref, rect() }: for a link, group = [the
      section] and ref = null; for a reference in plain text, group
      = every text run the reference touches (OCR text is one run
      per word) and ref = its character range in the re-joined
      visual line. Two targets are the same when group[0] and the
      ref range match. onOut consults both: leaving every element
      of `pending` cancels it without grace; leaving `open`
      schedules a CLOSE_GRACE_MS close, unless the pointer moved
      into the popup.
    hover_intent: >
      The open delay belongs to the TARGET, never to the pointer
      position. Pointer movement inside the same target (the tremor
      of a resting hand, crossing from "Fig." to "1.1") must not
      restart the delay: restarting on every mousemove made the
      popup wait for a stillness a hand never delivers. mousemove
      over text is probed once per animation frame (probeText); a
      probe that lands on the pending target is a no-op, on the
      open target cancels a scheduled close, on another reference
      schedules it (the visible popup is replaced when the new one
      is ready), and on ordinary text cancels a pending text target
      and, inside a run of the open target, schedules its close.
    prefetch: >
      schedule(target, prepare) starts prepare() immediately and
      shows the popup when BOTH the delay has elapsed and the
      content is ready, so reference lookup and page rendering
      overlap the delay instead of following it. An `attempt`
      counter invalidates superseded work. main.ts also calls
      CitationResolver.warmUp() and FloatResolver.warmUp() at idle
      after the first page renders.
    whole_run_rule: >
      caretRangeFromPoint picks the reference under the pointer.
      When it yields none and the hovered run is at most
      WHOLE_RUN_MAX_CHARS (14) long and overlaps exactly one
      reference, that reference is taken: on OCR per-word runs the
      whole word box answers ("[1])," with the pointer on the comma).
    line_cache: >
      The visual line of a probed run (spans, joined text, refs) is
      cached per run element in a WeakMap, for that run only —
      membership is judged from the probed run's own height and is
      not symmetric. A sideways run (several characters, taller
      than wide: a margin stamp) is its own one-run line with no
      refs, and is never a member of another run's line.
    placement: >
      The popup is centred under target.rect(): the link's box, or
      the union of the reference's character ranges (a Range per
      run, walking nested find-highlight spans).
  timing:
    open_delay: labshelf.reader.hoverDelayMs
    close_when: mouseout leaving both pendingAnchor and anchor
      without entering the popup, wheel/scroll on the viewer
      container, "scalechanging" event on the pdf.js EventBus,
      keydown, mousedown outside the popup
    close_grace_ms: 150 (CLOSE_GRACE_MS) for the anchor→popup gap
  resolution:
    - >-
      Load link annotations lazily per page via
      page.getAnnotations({ intent: "display" }); cache the
      resulting Link-subtype list keyed by pageNumber.
    - Resolve the destination via
      pdfDocument.getDestination(dest) when it is a name, otherwise
      keep the explicit array. Compute the destination page from
      dest[0] using pdfDocument.getPageIndex when it is a ref, or
      dest[0]+1 when it is already a page index.
    - destGeometry.destPoint parses XYZ / FitH / FitBH / FitV /
      FitBV / FitR / Fit / FitB into (x, y, kind); Fit and FitB
      return null coordinates and the preview falls back to
      top-of-page.
  citation_case:
    detection: >
      citationResolver.isInReferences(pageNumber, y, x) returns
      true when the destination page is the References page or a
      later page. On the References page it also compares y against
      the heading line's y (so a destination above the heading in a
      two-column layout does not misfire).
    resolver:
      module: webview/ui/citationResolver.ts + logic/referenceList.ts
      strategy: >
        Lazy. On the first citation hover, walk the last SCAN_FRACTION
        (0.4) of pages (minimum MIN_SCAN_PAGES = 4, maximum
        MAX_SCAN_PAGES = 60), looking for
        the References heading (findReferencesStart). Cache the
        headingLine and the entries by page.
      column_handling: >
        splitReferenceEntries uses textLines.groupItemsIntoLines
        which detects a gutter with detectColumns; entries are
        emitted per column, and entryAtY consults columnSplit + x
        to pick the right column.
    popup_shape:
      body: the reference entry text as one or more paragraphs
      actions:
        - >-
          Copy (posts { command: "copyText", text: <entry text> })
        - Jump (linkService.goToDestination + pushes history)
    failure_case: >
      When entryAt returns null (heading found but entry
      boundaries ambiguous), the reader falls back to the region
      preview (a cropped image of the destination page). It does
      NOT show a "Reference text unavailable" message: a picture
      is never wrong; extracted text could be.
  region_case:
    detection: destination is not in the References section, or is
      in the section but no reliable entry text is found
    render:
      strategy: offscreen render of the destination page to a
        canvas
      lru: >
        Up to PAGE_CACHE = 4 full-page renders kept in an LRU cache.
        Evicting an entry drops the canvas.
      css_width_px: PREVIEW_CSS_WIDTH = 420
      dpr_cap: 2
      crop: >
        cropRectForPreview centres a heightRatio (default 0.38)
        window near the destination y, keeping leadRatio (0.04) of
        context above so a figure caption or heading is not cut on
        its first line. Full page width.
      page_colors: honoured — the offscreen render passes the
        current theme.pageColors, and the cache is cleared when
        the page colours change.
    cancellation:
      - the active RenderTask is cancelled when the popup closes or
        when the hover switches to another link (destPreview.cancel)
      - rendering starts when the pointer enters the target, not
        after hoverDelayMs; a hover that ends early leaves the
        render to finish into the page cache

numeric_marker_fallback:
  scope: >
    Runs only when a page has no Link-subtype annotations at all
    (hoverPreview.openForMarker returns early otherwise). Author-
    year like "(Smith, 2019)" is out of scope.
  detection_module: webview/logic/citationMarkers.ts
  matches:
    - "[12]"
    - "[3, 7]"
    - "[3; 7]"
    - "[4-6]"
    - >-
      "[4–6]" (en-dash)
    - >-
      "[4—6]" (em-dash)
    - "[1, 3, 5-7]"
  rejections:
    - "[12.15]"
    - "[12abc]"
    - >-
      "12" (unbracketed)
  bounds:
    - digits limited to 3
    - ranges capped at MAX_RANGE = 50 (silently ignored otherwise)
  hit_testing:
    - mousemove is probed once per animation frame and follows the
      same hover-intent rules as link hovers (see
      hover_previews.target_state); document.caretRangeFromPoint
      locates the text node under the pointer
    - never injects DOM; the popup is anchored to the reference's
      character range
  action: opens the same textual popup used by real citation
    links, resolving reference index n through
    citationResolver.entryNumbered(n). Up to MAX_MARKER_ENTRIES = 3
    entries are shown; extra numbers become a "+K more" tail.

external_links:
  origin: >
    pdf.js keeps external <a> elements enabled in the DOM. The
    reader installs a capture-phase click listener on #viewer that
    intercepts anchor hrefs matching /^(https?:|mailto:)/i, calls
    preventDefault + stopPropagation, and posts
    { command: "openExternalLink", url: href }. Other schemes are
    ignored (the DOM never navigates because the click is inside
    the webview sandbox).
  host_handler:
    guard: isSafeExternalUrl in shared/protocol.ts (accepts http:,
      https:, mailto:; rejects file:, command:, vscode:,
      javascript:, data:)
    open: vscode.env.openExternal(vscode.Uri.parse(url))
    on_reject: logs a WARN with the paperId and drops the URL

database:
  tables_used:
    - annotations (source of truth is the sidecar; the SQLite cache
      is read by the reader indirectly via AnnotationManager)
  migrations: []

events:
  emits: []
  listens:
    - vscode.env.clipboard writes (Copy with Citation, Export →
      clipboard)
    - vscode.window.showSaveDialog result (Export → file)
    - vscode.env.openExternal for allowed URLs

errors:
  expected_failures:
    - selection is empty when Ctrl/Cmd+Shift+C is pressed
    - citekey / authors / year missing on the paper
    - clipboard write fails (permissions denied, unusual host)
    - showSaveDialog returns undefined (user cancelled)
    - writing the annotations file fails (disk full, target
      read-only)
    - References section not found by citationResolver.locate
    - reference entry boundaries ambiguous (entryAtY returns null)
    - offscreen page.render RenderTask cancelled after popup close
    - external link points at a disallowed scheme
    - a fallback citation marker matches [n] but n exceeds the
      reference count
  handling_strategy: >
    An empty selection makes copyWithCitation a no-op; the bubble
    does not appear. Missing citation fields degrade to the fallback
    labels documented under authorYearLabel_rule. Clipboard failures
    surface via PdfViewerPanel's default error path
    ("Reader action failed: <message>"). Cancelled save dialogs are
    silent. Write failures surface as an error message with the
    target path. When the References section is not found (or entry
    boundaries are ambiguous), the reader shows the region preview
    instead of guessing text. Cancelled RenderTasks are silently
    discarded. Disallowed external URLs are dropped by
    isSafeExternalUrl on the host and logged. Out-of-range marker
    indices return null from citationResolver.entryNumbered and are
    simply skipped in the popup.

ui:
  view_type: webview_panel
  panel_id: labshelfPdf
  design_principle: >
    Every paper-aware action lives on the surface the user is
    already looking at: the selection bubble for selections, the
    Annotations tab header for exports, the link itself for hover
    previews.
  layout:
    selection_bubble:
      - five colour swatches (yellow, green, blue, red, pink)
      - separator
      - >-
        "Cite" icon button on the right, activates copyWithCitation
    annotations_tab_header:
      - title "Annotations"
      - two icon buttons: clipboard (copy) and download (file)
    citation_popup:
      shape: card with a "Reference" header and Copy / Jump actions
      body: one or more paragraphs (one per resolved entry)
      failure_state: falls back to the region preview
    region_popup:
      shape: rounded card, PREVIEW_CSS_WIDTH ~ 420 CSS px wide, a
        cropped-page canvas following pageColors
      header: >-
        "Page <n>" with a Jump action
    external_link:
      cursor: pointer (pdf.js default)
      title (browser tooltip): the full URL
  keyboard:
    - "Ctrl/Cmd+Shift+C: Copy with Citation"
    - "Esc: close the citation or region popup"

tests:
  unit:
    - "__tests__/pdf-viewer/shared/citationFormat.test.ts:
      formatQuoteWithCitation renders each of the four styles with
      the exact shapes above; cleanQuote de-hyphenates and collapses
      whitespace; authorYearLabel yields 'Silva et al., 2021' for
      3+ authors, 'A & B, 2021' for two, 'Silva, 2021' for one,
      falls back to the citekey when authors is empty, and appends
      the year only when present"
    - "__tests__/pdf-viewer/shared/annotationsMarkdown.test.ts:
      groups by page ascending, orders by createdAt within a page,
      emits the empty state '_No annotations._' when the list is
      empty, formats highlights as block quotes followed by an HTML
      comment and pandoc citation, formats notes/comments/tags as
      '**Type:** text'"
    - "__tests__/pdf-viewer/webview/logic/citationMarkers.test.ts:
      detects [12], [3, 7], [4-6] and the en-dash / em-dash
      variants; rejects [12.15], [12abc] and bare 12; expands
      ranges under MAX_RANGE (50); markerAtOffset picks the right
      marker"
    - "__tests__/pdf-viewer/webview/logic/referenceList.test.ts:
      findReferencesStart matches every documented heading;
      splitReferenceEntries handles hanging-indent, numbered
      brackets and two-column layouts (fixtures at
      __tests__/fixtures/references/); entryAtY returns the entry
      whose y range contains the anchor; entryByNumber picks by
      marker number"
    - "__tests__/pdf-viewer/webview/logic/textLines.test.ts:
      detectColumns finds gutters and returns null for one-column
      pages; groupItemsIntoLines assembles reading-order lines
      keyed by column; runOrientation reads the quarter turn;
      readableItems drops a sideways margin stamp and OCR margin
      debris, keeps hanging markers, sideways pages and sparse pages"
    - "__tests__/pdf-viewer/webview/logic/destGeometry.test.ts:
      destPoint parses every documented destination kind;
      cropRectForPreview keeps the crop inside the page and
      preserves leadRatio of context above"
  integration:
    - "__tests__/pdf-viewer/PdfViewerPanel.test.ts (existing):
      copyWithCitation dispatches through formatQuoteWithCitation
      in each style and writes to vscode.env.clipboard;
      exportAnnotations covers both clipboard and file targets;
      openExternalLink accepts http/https/mailto and rejects
      file/command/vscode"
    - "__tests__/commands/registerCommands.test.ts (existing):
      labshelf.exportAnnotations resolves through resolvePaper,
      shows the quick pick, and delegates to
      PdfViewerPanel.exportAnnotations"
  manual:
    - Select two lines; press Ctrl/Cmd+Shift+C. The clipboard has
      the current style's output with the correct page number.
      Switch labshelf.reader.citationStyle and repeat.
    - Open Annotations, click Copy. Paste elsewhere; the Markdown
      matches formatAnnotationsMarkdown.
    - Click Export to file; save; the file lands in the paper folder
      as annotations.md and opens beside the reader.
    - Hover a "[12]" citation with hoverPreviews on. After 250 ms a
      popup shows the reference entry with Copy and Jump. Move the
      mouse; the popup closes.
    - Hover a citation whose reference boundaries the reader cannot
      recover — a cropped image preview appears instead (no
      "Reference text unavailable" wording).
    - Hover a "Fig. 3" or section link — a cropped image preview
      appears. Switch to sepia; the preview recolours.
    - Toggle labshelf.reader.hoverPreviews off — hovers stop opening
      popups.
    - Click an https link — vscode.env.openExternal opens it in the
      browser.
    - >-
      Click a file: / javascript: / vscode: link — nothing happens
      and the log records the rejection.

ai_notes:
  embeddings: false
  semantic_search: false
  reference_extraction_risk: >
    Parsing references is fragile. The reader never shows a
    possibly-wrong entry: when entry boundaries are ambiguous, the
    UI silently falls back to the cropped image preview of the
    destination.
  future_phase: >
    Author-year detection ("(Smith, 2019)"), DOI-based matching
    against the library, and inline annotation drawing are out of
    scope for this delivery. See
    documents/plans/gostaria-de-melhorar-o-mighty-pizza.md.
